<head>

<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>🕸️</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,700;1,400&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Courier+Prime:ital,wght@0,400;1,400&family=Crimson+Text:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:ital,wght@0,400;1,400&family=IBM+Plex+Sans:ital,wght@0,400;0,600;1,400&family=Inter:wght@400;600&family=JetBrains+Mono:wght@400;600&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,700;1,7..72,400&family=Lora:ital,wght@0,400;0,600;1,400&family=Manrope:wght@400;600&family=Merriweather:ital,wght@0,400;0,700;1,400&family=Montserrat:ital,wght@0,400;0,600;1,400&family=Noto+Sans:ital,wght@0,400;0,600;1,400&family=Noto+Serif:ital,wght@0,400;0,600;1,400&family=Nunito:ital,wght@0,400;0,600;1,400&family=Open+Sans:ital,wght@0,400;0,600;1,400&family=PT+Serif:ital,wght@0,400;0,700;1,400&family=Roboto:ital,wght@0,400;0,500;0,700;1,400&family=Rubik:ital,wght@0,400;0,600;1,400&family=Source+Sans+3:ital,wght@0,400;0,600;1,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=Spectral:ital,wght@0,400;0,600;1,400&display=swap">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --bg: #14161a; --bg-header: #191c21; --bg-panel: #1e2228; --bg-input: #191c21;
    --border: #23272e; --border-strong: #2e333b;
    --fg: #d4d7dc; --fg-dim: #6d737d; --fg-mid: #a8adb5;
    --accent: #8b919b; --accent-contrast: #14161a;
    --col-width: 720px; --line-height: 1.85; --letter-spacing: 0;
    --font-size: 20px;
    --font-stack: Georgia, 'Times New Roman', serif;
    --mark-color: #e0b84a;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --safe-left: env(safe-area-inset-left, 0px);
    --safe-right: env(safe-area-inset-right, 0px);
    --tap: 44px;
  }
  html, body { height: 100%; background: var(--bg); color: var(--fg);
    font-family: var(--font-stack); overflow: hidden;
    -webkit-text-size-adjust: 100%; text-size-adjust: 100%;
    overscroll-behavior: none; }
  #app { display: flex; flex-direction: column; height: 100%; width: 100%;
    padding-left: var(--safe-left); padding-right: var(--safe-right); }

  button, .btn, [role="button"] { background: var(--border); color: var(--fg);
    border: 1px solid var(--border-strong); padding: 8px 12px; border-radius: 8px;
    font-size: 13px; font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    cursor: pointer; line-height: 1.2; max-width: 100%; min-height: 36px;
    touch-action: manipulation; -webkit-user-select: none; user-select: none; }
  button:hover { background: var(--border-strong); }
  button:active { transform: translateY(1px); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  input[type=file] { display: none; }

  #boot-error { display: none; position: fixed; left: 12px; right: 12px; top: 12px;
    background: #3a1a1a; color: #ffd0d0; border: 1px solid #7a2a2a; border-radius: 8px;
    padding: 12px 14px; font-family: monospace; font-size: 12px; white-space: pre-wrap; z-index: 9999; }
  #file-toast { position: fixed; left: 50%; top: calc(16px + var(--safe-top)); transform: translateX(-50%);
    background: var(--bg-panel); border: 1px solid var(--border-strong); color: var(--fg);
    border-radius: 10px; padding: 10px 16px; font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    font-size: 13px; z-index: 10000; box-shadow: 0 8px 30px rgba(0,0,0,.5);
    display: none; max-width: min(90vw, 480px); text-align: center; line-height: 1.4; word-break: break-word; }
  #file-toast.show { display: block; }
  #file-toast.error { background: #3a1a1a; border-color: #7a2a2a; color: #ffd0d0; }

  .screen { flex: 1; display: none; overflow: hidden; position: relative; min-height: 0; }
  .screen.active { display: flex; }

  @media (hover: none) and (pointer: coarse) {
    * { scrollbar-width: none; -ms-overflow-style: none; }
    *::-webkit-scrollbar { width: 0; height: 0; display: none; }
  }

  .reader-text { overflow-wrap: anywhere; word-break: break-word; hyphens: auto; -webkit-hyphens: auto;
    font-size: var(--font-size); }
  .reader-text p { margin-bottom: 1.15em; text-indent: 2em; text-align: justify; orphans: 2; widows: 2; }
  .reader-text p:first-child { text-indent: 0; }
  .reader-text p.chapter-title { text-indent: 0 !important; text-align: center;
    margin: 2.2em 0 1.4em; font-size: 1.1em; letter-spacing: 1px; font-weight: 600;
    color: var(--accent); scroll-margin-top: 20px; }
  .reader-text p.chapter-title.level-2 { font-size: 1em; margin: 1.6em 0 1em; }
  .reader-text p.chapter-title.level-3 { font-size: .95em; margin: 1.2em 0 .8em; font-style: italic; }

  #classic-root { flex-direction: column; min-height: 0; }
  #paste-screen { display: none; flex: 1; flex-direction: column; padding: 12px;
    align-items: center; overflow-y: auto; overflow-x: hidden; min-height: 0; -webkit-overflow-scrolling: touch; }
  #paste-screen.active { display: flex; }
  #paste-screen .inner { width: 100%; max-width: 860px; display: flex; flex-direction: column;
    min-height: 0; padding-bottom: calc(16px + var(--safe-bottom)); }
  textarea#input { width: 100%; height: 160px; min-height: 120px; max-height: 220px;
    background: var(--bg-input); color: var(--fg);
    border: 1px solid var(--border-strong); border-radius: 8px; padding: 12px;
    font-size: 15px; line-height: 1.5; font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    resize: vertical; outline: none; max-width: 100%; }
  textarea#input:focus { border-color: var(--accent); }
  #paste-screen .actions { display: flex; justify-content: center; gap: 8px; margin-top: 10px;
    flex-wrap: wrap; flex-shrink: 0; }
  #paste-screen .actions button { min-height: var(--tap); font-size: 14px; padding: 10px 16px; }
  #library { margin-top: 16px; border-top: 1px solid var(--border); padding-top: 12px; }
  #library-search-wrap { margin-bottom: 10px; display: flex; gap: 6px; align-items: center; }
  #library-search { flex: 1; min-width: 0; background: var(--bg-input); color: var(--fg);
    border: 1px solid var(--border-strong); border-radius: 8px; padding: 10px 12px;
    font-size: 14px; outline: none; font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    max-width: 100%; min-height: 40px; }
  #library-search:focus { border-color: var(--accent); }
  #library-search-clear { background: transparent; border: 1px solid var(--border-strong);
    color: var(--fg-dim); font-size: 14px; padding: 8px 10px; cursor: pointer; line-height: 1;
    border-radius: 8px; display: none; flex-shrink: 0; min-height: 40px; min-width: 40px; }
  #library-search-wrap.has-value #library-search-clear { display: block; }

  .book-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
  .book-item { background: var(--bg-panel); border: 1px solid var(--border-strong);
    border-radius: 10px; padding: 12px 14px 12px 34px; display: flex; flex-direction: column;
    gap: 5px; cursor: pointer; position: relative; transition: border-color .15s, background .15s;
    touch-action: pan-y; user-select: none; min-width: 0; }
  .book-item:hover { border-color: var(--accent); }
  .book-item .grip { position: absolute; left: 4px; top: 50%; transform: translateY(-50%);
    width: 24px; height: 40px; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 3px; cursor: grab; border-radius: 5px; touch-action: none; }
  .book-item .grip span { display: block; width: 13px; height: 2px; border-radius: 1px; background: var(--fg-dim); }
  .book-item .grip:hover { background: var(--border-strong); }
  .book-item .grip:hover span { background: var(--fg); }
  .book-item.dragging { opacity: .55; border-color: var(--accent); box-shadow: 0 8px 24px rgba(0,0,0,.45); }
  .book-item.drop-before { box-shadow: inset 3px 0 0 0 var(--accent); }
  .book-item.drop-after { box-shadow: inset -3px 0 0 0 var(--accent); }
  .book-item .title { font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    font-size: 14px; color: var(--fg); font-weight: 600; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; padding-right: 52px; min-width: 0; }
  .book-item .meta { font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    font-size: 11px; color: var(--fg-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .book-item .book-categories { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 2px; }
  .book-item .cat-tag { font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    font-size: 10px; color: var(--accent); letter-spacing: .3px; text-transform: uppercase;
    padding: 2px 7px; border-radius: 8px;
    background: rgba(139,145,155,.12); border: 1px solid var(--border-strong);
    cursor: pointer; max-width: 100%; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; min-height: 22px; display: inline-flex; align-items: center; }
  .book-item .cat-tag:hover { border-color: var(--accent); }
  .book-item .cat-tag.none { color: var(--fg-dim); background: transparent; border-style: dashed; }
  .book-item .cat-tag .cat-x { margin-left: 4px; opacity: .6; }
  .book-item .cat-tag .cat-x:hover { opacity: 1; color: #ff9a9a; }
  .book-item .progress-line { height: 3px; border-radius: 2px; background: var(--border);
    overflow: hidden; margin-top: 2px; }
  .book-item .progress-line span { display: block; height: 100%; background: var(--accent); }
  .book-item .del, .book-item .rename { position: absolute; top: 6px; background: transparent;
    border: none; color: var(--fg-dim); font-size: 14px; padding: 4px 8px; line-height: 1;
    border-radius: 6px; cursor: pointer; min-height: 30px; min-width: 30px; }
  .book-item .del { right: 6px; }
  .book-item .rename { right: 38px; font-size: 13px; }
  .book-item .del:hover { background: var(--border-strong); color: var(--fg); }
  .book-item .rename:hover { background: var(--border-strong); color: var(--accent); }
  #library-empty, #library-no-results { font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    font-size: 12px; color: var(--fg-dim); text-align: center; padding: 14px;
    border: 1px dashed var(--border-strong); border-radius: 8px; }
  #library-no-results { display: none; }
  #library-no-results.show { display: block; }

  #categories-bar { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; align-items: center; }
  .category-chip { display: inline-flex; align-items: center; gap: 6px;
    background: var(--bg-panel); border: 1px solid var(--border-strong); border-radius: 20px;
    padding: 6px 12px; font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    font-size: 12px; color: var(--fg-mid); cursor: pointer; user-select: none;
    transition: border-color .15s, color .15s, background .15s; max-width: 100%; min-height: 34px; }
  .category-chip > span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .category-chip:hover { border-color: var(--accent); color: var(--fg); }
  .category-chip.active { border-color: var(--accent); color: var(--fg); background: var(--border-strong); }
  .category-chip .count { font-size: 10px; color: var(--fg-dim); font-variant-numeric: tabular-nums; flex-shrink: 0; }
  .category-chip.active .count { color: var(--accent); }
  .category-chip .chip-actions { display: inline-flex; align-items: center; gap: 1px; flex-shrink: 0; }
  .category-chip .chip-edit, .category-chip .chip-del { background: transparent; border: none;
    color: var(--fg-dim); padding: 0 4px; font-size: 11px; line-height: 1; cursor: pointer;
    border-radius: 3px; flex-shrink: 0; min-height: 24px; min-width: 24px; }
  .category-chip .chip-edit:hover { color: var(--fg); background: var(--border); }
  .category-chip .chip-del:hover { color: #ff9a9a; background: #3a1a1a; }
  .category-chip.add-chip { border-style: dashed; color: var(--fg-dim); padding: 6px 12px; }
  .category-chip.add-chip:hover { color: var(--accent); border-color: var(--accent); }

  .panel { position: fixed; top: 0; right: 0; width: min(380px, 100vw); height: 100%;
    background: var(--bg-header); border-left: 1px solid var(--border);
    z-index: 300; transform: translateX(100%); transition: transform .25s ease;
    display: flex; flex-direction: column;
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    padding-top: var(--safe-top); padding-bottom: var(--safe-bottom); }
  .panel.open { transform: translateX(0); }
  .panel-header { padding: 14px 18px; border-bottom: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: center;
    font-size: 13px; color: var(--accent); letter-spacing: 1px; text-transform: uppercase;
    flex-shrink: 0; gap: 8px; min-height: 52px; }
  .panel-body { flex: 1; overflow-y: auto; padding: 8px 0; min-height: 0; -webkit-overflow-scrolling: touch; }
  .panel-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 299; display: none; }
  .panel-overlay.open { display: block; }

  #toc-panel { width: min(440px, 100vw); }
  #toc-list .toc-item { padding: 12px 18px; border-bottom: 1px solid var(--border);
    cursor: pointer; transition: background .15s; display: flex; align-items: center; gap: 10px; }
  #toc-list .toc-item:hover { background: var(--bg-panel); }
  #toc-list .toc-item.active { background: var(--bg-panel); border-left: 3px solid var(--accent); }
  #toc-list .toc-num { font-size: 11px; color: var(--fg-dim); font-variant-numeric: tabular-nums;
    min-width: 24px; text-align: right; flex-shrink: 0; }
  #toc-list .toc-item.active .toc-num { color: var(--accent); }
  #toc-list .toc-title { font-size: 13px; color: var(--fg); line-height: 1.4;
    word-break: break-word; flex: 1; min-width: 0; }
  #toc-list .toc-item.active .toc-title { color: var(--accent); font-weight: 600; }
  #toc-list .toc-pct { font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    font-size: 11px; color: var(--fg-dim); font-variant-numeric: tabular-nums;
    flex-shrink: 0; min-width: 48px; text-align: right; padding-left: 6px;
    background: rgba(139,145,155,.10); border: 1px solid var(--border);
    border-radius: 6px; padding: 3px 7px; }
  #toc-list .toc-item.active .toc-pct { color: var(--accent-contrast); background: var(--accent); border-color: var(--accent); }
  #toc-list .toc-item.level-2 { padding-left: 34px; }
  #toc-list .toc-item.level-3 { padding-left: 50px; }
  #toc-list .toc-item.level-2 .toc-title { font-size: 12px; color: var(--fg-mid); }
  #toc-empty { padding: 24px 20px; font-size: 13px; color: var(--fg-dim);
    text-align: center; line-height: 1.5; }

  #marks-header-actions { display: flex; gap: 6px; }
  #marks-header button { padding: 6px 10px; font-size: 12px; min-height: 34px; }
  #marks-search-wrap { padding: 8px 12px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
  #marks-search { width: 100%; background: var(--bg-input); color: var(--fg);
    border: 1px solid var(--border-strong); border-radius: 8px; padding: 9px 12px;
    font-size: 13px; outline: none; font-family: -apple-system, Segoe UI, Roboto, sans-serif; min-height: 38px; }
  #marks-search:focus { border-color: var(--accent); }
  #marks-list { flex: 1; overflow-y: auto; padding: 8px 0; min-height: 0; -webkit-overflow-scrolling: touch; }
  .mark-item { padding: 12px 18px; border-bottom: 1px solid var(--border);
    cursor: pointer; position: relative; transition: background .15s; }
  .mark-item:hover { background: var(--bg-panel); }
  .mark-item .mark-title { font-size: 12px; color: var(--fg-dim);
    text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; padding-right: 30px; }
  .mark-item .mark-text { font-size: 13px; color: var(--fg); line-height: 1.4;
    margin-bottom: 6px; display: -webkit-box; -webkit-line-clamp: 3;
    -webkit-box-orient: vertical; overflow: hidden; word-break: break-word; }
  .mark-item .mark-date { font-size: 10px; color: var(--fg-dim); }
  .mark-item .mark-note { font-size: 12px; color: var(--mark-color);
    background: rgba(224,184,74,.08); border-left: 2px solid var(--mark-color);
    padding: 6px 8px; border-radius: 3px; margin: 6px 0; line-height: 1.35;
    word-break: break-word; white-space: pre-wrap; }
  .mark-item .mark-del { position: absolute; top: 10px; right: 10px;
    background: transparent; border: none; color: var(--fg-dim); font-size: 14px;
    padding: 6px 10px; line-height: 1; border-radius: 4px; cursor: pointer; min-height: 32px; min-width: 32px; }
  .mark-item .mark-del:hover { background: var(--border-strong); color: var(--fg); }
  #marks-empty { padding: 24px 20px; font-size: 13px; color: var(--fg-dim); text-align: center; line-height: 1.5; }

  #search-panel { width: min(400px, 100vw); }
  #search-input-wrap { padding: 10px 14px; border-bottom: 1px solid var(--border);
    display: flex; gap: 6px; align-items: center; flex-shrink: 0; }
  #book-search-input { flex: 1; min-width: 0; background: var(--bg-input); color: var(--fg);
    border: 1px solid var(--border-strong); border-radius: 8px;
    padding: 9px 12px; font-size: 14px; outline: none;
    font-family: -apple-system, Segoe UI, Roboto, sans-serif; max-width: 100%; width: 100%; min-height: 38px; }
  #book-search-input:focus { border-color: var(--accent); }
  #book-search-clear { background: transparent; border: 1px solid var(--border-strong);
    color: var(--fg-dim); font-size: 14px; padding: 8px 10px; cursor: pointer;
    line-height: 1; border-radius: 8px; display: none; flex-shrink: 0; min-width: 38px; min-height: 38px; }
  #search-input-wrap.has-value #book-search-clear { display: block; }
  #search-meta { padding: 8px 14px 12px; font-size: 12px; color: var(--fg-dim);
    font-variant-numeric: tabular-nums; border-bottom: 1px solid var(--border); min-height: 20px; flex-shrink: 0; }
  #search-meta strong { color: var(--accent); font-weight: 600; }
  #search-results { flex: 1; overflow-y: auto; padding: 6px 0; min-height: 0; -webkit-overflow-scrolling: touch; }
  .search-item { padding: 12px 16px; border-bottom: 1px solid var(--border);
    cursor: pointer; position: relative; transition: background .15s; }
  .search-item:hover { background: var(--bg-panel); }
  .search-item.active { background: var(--bg-panel); border-left: 2px solid var(--accent); }
  .search-item .s-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 5px; min-width: 0; }
  .search-item .s-chapter { font-size: 11px; color: var(--fg-dim);
    text-transform: uppercase; letter-spacing: 1px; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
  .search-item .s-pct { font-size: 12px; color: var(--accent);
    font-variant-numeric: tabular-nums; font-weight: 600; flex-shrink: 0;
    background: rgba(139,145,155,.12); padding: 2px 8px; border-radius: 8px; }
  .search-item.active .s-pct { background: var(--accent); color: var(--bg); }
  .search-item .s-text { font-size: 12px; color: var(--fg-mid); line-height: 1.45; word-break: break-word; }
  .search-item .s-text mark { background: var(--accent); color: var(--accent-contrast);
    border-radius: 2px; padding: 0 2px; }
  #search-empty { padding: 24px 16px; font-size: 13px; color: var(--fg-dim); text-align: center; line-height: 1.5; }
  .find-hit { background: rgba(139,145,155,.35); border-radius: 3px;
    box-shadow: 0 0 0 1px var(--accent); transition: background .4s; }

  .reader-topbar {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 12px; padding-top: max(8px, var(--safe-top));
    background: var(--bg-header); border-bottom: 1px solid var(--border);
    flex-shrink: 0; min-height: 52px;
  }
  .reader-topbar .logo { display: flex; align-items: center; gap: 0;
    font-weight: 700; font-size: 15px; color: var(--fg);
    flex-shrink: 0; letter-spacing: -.3px; }
  .reader-topbar .toc-btn {
    background: var(--bg-panel); border: 1px solid var(--border-strong);
    color: var(--fg); height: 40px; border-radius: 10px;
    font-size: 15px; padding: 0 12px; cursor: pointer;
    display: flex; align-items: center; gap: 6px; flex-shrink: 0;
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
  }
  .reader-topbar .toc-btn:hover { background: var(--border-strong); }
  .reader-topbar .pct {
    margin-left: auto; margin-right: 4px;
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums;
    color: var(--accent); background: var(--bg-panel);
    border: 1px solid var(--border-strong); border-radius: 8px;
    padding: 6px 10px; min-width: 64px; text-align: center;
    cursor: pointer; user-select: none; min-height: 34px;
    display: flex; align-items: center; justify-content: center;
  }
  .reader-topbar .settings-btn {
    background: var(--bg-panel); border: 1px solid var(--border-strong);

<script>
(function () {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const root = document.documentElement;

  function showError(msg) {
    const box = $('boot-error'); if (!box) return;
    box.style.display = 'block'; box.textContent = 'Ошибка запуска:\n' + msg;
  }
  function toast(msg, isError) {
    const el = $('file-toast'); if (!el) return;
    el.textContent = msg; el.classList.toggle('error', !!isError); el.classList.add('show');
    clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('show'), 3000);
  }
  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }
  function formatDate(ts) {
    try {
      const d = new Date(ts); const pad = (n) => n < 10 ? '0' + n : '' + n;
      return pad(d.getDate()) + '.' + pad(d.getMonth()+1) + '.' + d.getFullYear() +
             ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
    } catch (e) { return ''; }
  }
  function shade(hex, amt) {
    try {
      const n = hex.replace('#','');
      const num = parseInt(n.length === 3 ? n.split('').map(c=>c+c).join('') : n, 16);
      let r = (num >> 16) & 255, g = (num >> 8) & 255, b = num & 255;
      r = Math.max(0, Math.min(255, r + amt));
      g = Math.max(0, Math.min(255, g + amt));
      b = Math.max(0, Math.min(255, b + amt));
      return '#' + ((1<<24) + (r<<16) + (g<<8) + b).toString(16).slice(1);
    } catch (e) { return hex; }
  }
  function mix(c1, c2, t) {
    try {
      const p = (c) => {
        const n = c.replace('#','');
        const v = parseInt(n.length === 3 ? n.split('').map(x=>x+x).join('') : n, 16);
        return [(v>>16)&255, (v>>8)&255, v&255];
      };
      const a = p(c1), b = p(c2);
      const r = a.map((v, i) => Math.round(v * (1 - t) + b[i] * t));
      return '#' + r.map(x => x.toString(16).padStart(2, '0')).join('');
    } catch (e) { return c1; }
  }
  function contrastColor(hex) {
    try {
      const n = hex.replace('#','');
      const v = parseInt(n.length === 3 ? n.split('').map(x=>x+x).join('') : n, 16);
      const r = (v>>16)&255, g = (v>>8)&255, b = v&255;
      const luma = (0.299*r + 0.587*g + 0.114*b) / 255;
      return luma > 0.55 ? '#14161a' : '#ffffff';
    } catch (e) { return '#ffffff'; }
  }
  function normalizeHex(v) {
    let s = String(v || '').trim().toLowerCase();
    if (!s.startsWith('#')) s = '#' + s;
    if (/^#([0-9a-f]{3})$/.test(s)) s = '#' + s[1]+s[1]+s[2]+s[2]+s[3]+s[3];
    if (!/^#[0-9a-f]{6}$/.test(s)) return null;
    return s;
  }

  const inlineDlg = $('inline-dialog');
  const inlineTitle = $('inline-dialog-title');
  const inlineInput = $('inline-dialog-input');
  const inlineTextarea = $('inline-dialog-textarea');
  const inlineOk = $('inline-dialog-ok');
  const inlineCancel = $('inline-dialog-cancel');
  let inlineResolve = null;

  function openInlineDialog(opts) {
    return new Promise((resolve) => {
      inlineResolve = resolve;
      inlineTitle.textContent = opts.title || '';
      const isText = !!opts.textarea;
      inlineInput.style.display = isText ? 'none' : 'block';
      inlineTextarea.style.display = isText ? 'block' : 'none';
      if (isText) {
        inlineTextarea.value = opts.value || '';
        inlineTextarea.placeholder = opts.placeholder || '';
        setTimeout(() => inlineTextarea.focus(), 40);
      } else {
        inlineInput.value = opts.value || '';
        inlineInput.placeholder = opts.placeholder || '';
        setTimeout(() => { inlineInput.focus(); inlineInput.select(); }, 40);
      }
      inlineOk.className = opts.danger ? 'danger' : 'primary';
      inlineOk.textContent = opts.okText || 'OK';
      inlineCancel.style.display = opts.hideCancel ? 'none' : '';
      inlineDlg.classList.add('open');
    });
  }
  function closeInlineDialog(result) {
    inlineDlg.classList.remove('open');
    if (inlineResolve) { const r = inlineResolve; inlineResolve = null; r(result); }
  }
  inlineOk.addEventListener('click', () => {
    const isText = inlineTextarea.style.display !== 'none';
    closeInlineDialog(isText ? inlineTextarea.value : inlineInput.value);
  });
  inlineCancel.addEventListener('click', () => closeInlineDialog(null));
  inlineDlg.addEventListener('click', (e) => { if (e.target === inlineDlg) closeInlineDialog(null); });
  inlineInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); inlineOk.click(); }
    if (e.key === 'Escape') { e.preventDefault(); closeInlineDialog(null); }
  });

  function askText(title, value, placeholder) { return openInlineDialog({ title, value, placeholder }); }
  function askLongText(title, value, placeholder) { return openInlineDialog({ title, value, placeholder, textarea: true }); }
  function askConfirm(title, okText, danger) {
    return openInlineDialog({ title, okText: okText || 'OK', danger: !!danger, hideCancel: false, value: '' }).then(v => v !== null);
  }

  const DEFAULTS = {

  };
  const FONT_STACKS = {

  };
  const FONTS = [

  const PRESET_GROUPS = [
    { title: 'Для сна', presets: [

    ]},
    { title: 'Цветные', presets: [

      { name: 'Графит', bg: '#1a1a1d', fg: '#c8c8cc', accent: '#70707a' }
    ]}
  ];
  function loadSettings() {
    try {
      const s = JSON.parse(localStorage.getItem('reader_settings') || '{}');
      return Object.assign({}, DEFAULTS, s);
    } catch (e) { return Object.assign({}, DEFAULTS); }
  }
  let settings = loadSettings();
  function saveSettings() { try { localStorage.setItem('reader_settings', JSON.stringify(settings)); } catch (e) {} }

  const CUSTOM_PALETTES_KEY = 'reader_custom_palettes_v1';
  function loadCustomPalettes() {
    try {
      const raw = localStorage.getItem(CUSTOM_PALETTES_KEY);
      if (!raw) return [];
      const arr = JSON.parse(raw);
      if (!Array.isArray(arr)) return [];
      return arr.filter(p => p && typeof p.bg === 'string' && typeof p.fg === 'string' && typeof p.accent === 'string')
        .map(p => ({
          id: p.id || ('p' + Date.now() + Math.random().toString(36).slice(2,6)),
          name: p.name || 'Моя схема',
          bg: normalizeHex(p.bg) || '#000000',
          fg: normalizeHex(p.fg) || '#ffffff',
          accent: normalizeHex(p.accent) || '#888888',
          pinned: !!p.pinned,
          created: p.created || Date.now()
        }));
    } catch (e) { return []; }
  }
  function saveCustomPalettes(arr) {
    try { localStorage.setItem(CUSTOM_PALETTES_KEY, JSON.stringify(arr)); } catch (e) {}
  }

  const META_KEY = 'reader_books_meta_v5';
  const TEXT_PREFIX = 'reader_book_text_';
  const OLD_META_KEY = 'reader_books_meta_v4';
  const OLD_COLLECTIONS_KEY = 'reader_collections_v2';

  function loadMeta() {
    try { const raw = localStorage.getItem(META_KEY); if (raw) return migrateMeta(JSON.parse(raw) || []); } catch (e) {}
    try {
      const old = JSON.parse(localStorage.getItem(OLD_META_KEY) || '[]');
      if (Array.isArray(old) && old.length) {
        const migrated = migrateMeta(old);
        saveMeta(migrated); return migrated;
      }
    } catch (e) {}
    return [];
  }
  function migrateMeta(arr) {
    if (!Array.isArray(arr)) return [];
    return arr.map(b => {
      if (!Array.isArray(b.categories)) b.categories = [];
      return b;
    });
  }
  function saveMeta(arr) {
    try { localStorage.setItem(META_KEY, JSON.stringify(arr)); }
    catch (e) { toast('Не удалось сохранить библиотеку', true); }
  }
  function getBookText(id) { try { return localStorage.getItem(TEXT_PREFIX + id) || ''; } catch (e) { return ''; } }
  function setBookText(id, text) {
    try { localStorage.setItem(TEXT_PREFIX + id, text); return true; }
    catch (e) { toast('Текст книги слишком велик', true); return false; }
  }
  function removeBookData(id) {
    try { localStorage.removeItem(TEXT_PREFIX + id); } catch (e) {}
    try { localStorage.removeItem(marksKey(id)); } catch (e) {}
  }
  const CATEGORIES_KEY = 'reader_categories_v3';
  function loadCategories() {

    return [];
  }
  function saveCategories(arr) { try { localStorage.setItem(CATEGORIES_KEY, JSON.stringify(arr)); } catch (e) {} }
  function marksKey(bookId) { return 'reader_marks_' + (bookId || 'scratch'); }
  function loadMarks(bookId) { try { return JSON.parse(localStorage.getItem(marksKey(bookId)) || '[]'); } catch (e) { return []; } }
  function saveMarks(bookId, arr) { try { localStorage.setItem(marksKey(bookId), JSON.stringify(arr)); } catch (e) {} }
  function sortBooks(list) {
    return list.slice().sort((a, b) => {
      const ao = typeof a.order === 'number' ? a.order : 0;
      const bo = typeof b.order === 'number' ? b.order : 0;
      if (ao !== bo) return ao - bo;
      return (b.added || 0) - (a.added || 0);
    });
  }
  function guessTitle(text) {
    const lines = String(text || '').split('\n').map(l => l.trim()).filter(Boolean);
    for (const l of lines.slice(0, 10)) if (l.length >= 3 && l.length <= 80) return l;
    return 'Без названия';
  }
  function countWords(text) { return String(text || '').trim().split(/\s+/).filter(Boolean).length; }

  /* ==================== МАРКЕРЫ ГЛАВ ==================== */
  const CH_OPEN = '\u0001CH:';
  const CH_MID = '\u0002';
  const CH_CLOSE = '\u0003';
  const CH_RE = /\u0001CH:(\d+)\u0002([^\u0003]*)\u0003/g;

  function makeChapterMarker(level, title) {
    const t = String(title || '').replace(/[\u0001\u0002\u0003]/g, ' ').replace(/\s+/g, ' ').trim();
    return CH_OPEN + (level || 1) + CH_MID + t + CH_CLOSE;
  }
  function parseChapterMarkers(text) {
    const chapters = [];
    if (!text || text.indexOf(CH_OPEN) === -1) return { chapters, clean: text || '' };
    const clean = String(text).replace(CH_RE, (m, lvl, title) => {
      chapters.push({
        index: chapters.length,
        title: title.trim() || ('Раздел ' + (chapters.length + 1)),
        level: parseInt(lvl, 10) || 1
      });
      return '';
    });
    return { chapters, clean };
  }

  /* ==================== НОРМАЛИЗАЦИЯ ==================== */
  function normalizeRawText(text) {
    let t = String(text || '');
    t = t.replace(/\r\n?/g, '\n');
    t = t.replace(/\u00a0/g, ' ');
    t = t.replace(/[ \t]+\n/g, '\n');
    t = t.replace(/\n{4,}/g, '\n\n\n');
    t = t.replace(/^\s+/, '').replace(/\s+$/, '');
    return t;
  }
  function splitIntoParagraphs(text) {
    const blocks = String(text || '').split(/\n\s*\n/).map(b => b.trim()).filter(Boolean);
    if (blocks.length <= 1) {
      const lines = String(text || '').split('\n').map(l => l.trim()).filter(Boolean);
      if (lines.length > 1) return lines;
      return [String(text || '').trim()];
    }
    return blocks;
  }
  function cleanHeadingForDisplay(rawText) {
    return String(rawText || '').replace(/\u00a0/g, ' ').replace(/[\*\_`~>#]+/g, '').replace(/\s+/g, ' ').trim();
  }

  /* ==================== ДЕКОДИРОВАНИЕ / UNZIP ==================== */
  function decodeBuffer(buffer) {
    const bytes = new Uint8Array(buffer);
    if (bytes.length >= 3 && bytes[0] === 0xEF && bytes[1] === 0xBB && bytes[2] === 0xBF)
      return new TextDecoder('utf-8').decode(bytes.subarray(3));
    if (bytes.length >= 2 && bytes[0] === 0xFF && bytes[1] === 0xFE)
      return new TextDecoder('utf-16le').decode(bytes.subarray(2));
    if (bytes.length >= 2 && bytes[0] === 0xFE && bytes[1] === 0xFF)
      return new TextDecoder('utf-16be').decode(bytes.subarray(2));
    let utf8 = '';
    try { utf8 = new TextDecoder('utf-8', { fatal: true }).decode(bytes); if (!utf8.includes('\uFFFD')) return utf8; } catch (e) {}
    try { const w = new TextDecoder('windows-1251').decode(bytes); if (w && !w.includes('\uFFFD')) return w; } catch (e) {}
    try { const k = new TextDecoder('koi8-r').decode(bytes); if (k && !k.includes('\uFFFD')) return k; } catch (e) {}
    return utf8 || new TextDecoder('utf-8').decode(bytes);
  }
  async function unzip(arrayBuffer) {
    const bytes = new Uint8Array(arrayBuffer);
    const view = new DataView(arrayBuffer);
    const files = {};
    let eocd = -1;
    for (let i = bytes.length - 22; i >= Math.max(0, bytes.length - 65558); i--) {
      if (view.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
    }
    if (eocd < 0) throw new Error('Не найден ZIP-каталог');
    const cdOffset = view.getUint32(eocd + 16, true);
    const cdCount = view.getUint16(eocd + 10, true);
    let p = cdOffset;
    for (let i = 0; i < cdCount; i++) {
      if (view.getUint32(p, true) !== 0x02014b50) break;
      const compMethod = view.getUint16(p + 10, true);
      const compSize = view.getUint32(p + 20, true);
      const nameLen = view.getUint16(p + 28, true);
      const extraLen = view.getUint16(p + 30, true);
      const commentLen = view.getUint16(p + 32, true);
      const localOffset = view.getUint32(p + 42, true);
      const name = new TextDecoder('utf-8').decode(bytes.subarray(p + 46, p + 46 + nameLen));
      p += 46 + nameLen + extraLen + commentLen;
      const lhNameLen = view.getUint16(localOffset + 26, true);
      const lhExtraLen = view.getUint16(localOffset + 28, true);
      const dataStart = localOffset + 30 + lhNameLen + lhExtraLen;
      const dataEnd = dataStart + compSize;
      files[name] = { data: bytes.subarray(dataStart, dataEnd), compMethod };
    }
    const result = {};
    for (const name in files) {
      const f = files[name];
      try {
        if (f.compMethod === 0) {
          result[name] = decodeBuffer(f.data.buffer.slice(f.data.byteOffset, f.data.byteOffset + f.data.byteLength));
        } else if (f.compMethod === 8 && typeof DecompressionStream !== 'undefined') {
          const ds = new DecompressionStream('deflate-raw');
          const stream = new Blob([f.data]).stream().pipeThrough(ds);
          result[name] = decodeBuffer(await new Response(stream).arrayBuffer());
        } else result[name] = '';
      } catch (e) { result[name] = ''; }
    }
    return result;
  }

  /* ==================== ИЗВЛЕЧЕНИЕ ТЕКСТА ==================== */
  function textFromHtml(html) {
    const doc = new DOMParser().parseFromString(html, 'text/html');
    doc.querySelectorAll('script,style,noscript,head,meta,link,nav').forEach(n => n.remove());
    const body = doc.body || doc.documentElement;
    body.querySelectorAll('br').forEach(br => br.replaceWith('\n'));
    body.querySelectorAll('p,div,h1,h2,h3,h4,h5,h6,li,tr,section,article,blockquote').forEach(n => {
      n.appendChild(doc.createTextNode('\n\n'));
    });
    let text = body.textContent || '';
    return text.replace(/\u00a0/g, ' ').replace(/[ \t]+\n/g, '\n').replace(/\n{3,}/g, '\n\n').trim();
  }
  function textFromFb2(xml) {
    const doc = new DOMParser().parseFromString(xml, 'application/xml');
    if (doc.querySelector('parsererror')) return textFromHtml(xml);
    const body = doc.querySelector('body'); if (!body) return '';
    const out = [];
    const walk = (node) => {
      for (const child of node.children) {
        const tag = (child.tagName || '').toLowerCase();
        if (tag === 'title') {
          const t = (child.textContent || '').replace(/\s+/g, ' ').trim();
          if (t) out.push(t + '\n\n');
        } else if (tag === 'p') {
          const t = (child.textContent || '').trim();
          if (t) out.push(t + '\n\n');
        } else if (tag === 'section' || tag === 'epigraph' || tag === 'annotation') {
          walk(child);
        } else if (tag === 'subtitle') {
          const t = (child.textContent || '').replace(/\s+/g, ' ').trim();
          if (t) out.push(t + '\n\n');
        }
      }
    };
    walk(body);
    return out.join('').replace(/\n{3,}/g, '\n\n').trim();
  }
  function textFromDocx(xml) {
    const doc = new DOMParser().parseFromString(xml, 'application/xml');
    if (doc.querySelector('parsererror')) return '';
    const paras = doc.querySelectorAll('w\\:p, p'); const out = [];
    paras.forEach(p => {
      const texts = p.querySelectorAll('w\\:t, t'); let line = '';
      texts.forEach(t => { line += t.textContent; });
      if (line.trim()) out.push(line.trim());
    });
    return out.join('\n\n').replace(/\n{3,}/g, '\n\n').trim();
  }
  function textFromOdt(xml) {
    const doc = new DOMParser().parseFromString(xml, 'application/xml');
    if (doc.querySelector('parsererror')) return '';
    const paras = doc.querySelectorAll('text\\:p, p'); const out = [];
    paras.forEach(p => { const line = (p.textContent || '').trim(); if (line) out.push(line); });
    return out.join('\n\n').replace(/\n{3,}/g, '\n\n').trim();
  }
  function textFromRtf(rtf) {
    let text = rtf;
    text = text.replace(/\\fonttbl[\s\S]*?\}/g, '').replace(/\\colortbl[\s\S]*?\}/g, '')
      .replace(/\\stylesheet[\s\S]*?\}/g, '').replace(/\\info[\s\S]*?\}/g, '').replace(/\\pict[\s\S]*?\}/g, '');
    text = text.replace(/\\par[d]?\b/g, '\n').replace(/\\line\b/g, '\n').replace(/\\tab\b/g, '\t');
    text = text.replace(/\\u(-?\d+)\??/g, (m, n) => { let c = parseInt(n, 10); if (c < 0) c += 65536; return String.fromCharCode(c); });
    text = text.replace(/\\'([0-9a-fA-F]{2})/g, (m, h) => String.fromCharCode(parseInt(h, 16)));
    text = text.replace(/\\[a-zA-Z]+-?\d* ?/g, '').replace(/[{}]/g, '').replace(/\r/g, '').replace(/\n{3,}/g, '\n\n');
    return text.trim();
  }
  function textFromJson(json) {
    try {
      const obj = JSON.parse(json);
      if (typeof obj === 'string') return obj;
      const tf = ['text','content','body','book','story','data'];
      for (const f of tf) if (typeof obj[f] === 'string' && obj[f].length > 20) return obj[f];
      if (Array.isArray(obj)) return obj.map(x => typeof x === 'string' ? x : (x && x.text) || '').join('\n\n');
      return JSON.stringify(obj, null, 2);
    } catch (e) { return ''; }
  }
  function textFromCsv(csv) {
    return csv.split(/\r?\n/).map(row => row.split(/[,;\t]/).map(c => c.replace(/^"|"$/g, '')).join(' ')).join('\n');
  }

  /* ==================== ГЛАВЫ ИЗ HTML/FB2/MD ==================== */
  function chaptersFromHtml(html) {
    const doc = new DOMParser().parseFromString(html, 'text/html');
    const out = [];
    doc.querySelectorAll('h1, h2, h3, h4').forEach((h) => {
      if (h.closest('nav')) return;
      const t = (h.textContent || '').replace(/\s+/g, ' ').trim();
      if (!t) return;
      const tag = (h.tagName || '').toUpperCase();
      const lvl = tag === 'H1' ? 1 : tag === 'H2' ? 2 : 3;
      out.push({ title: t, anchorText: t, level: lvl });
    });
    return out;
  }
  function chaptersFromMarkdown(md) {
    const out = [];
    const re = /^(#{1,4})\s+(.+)$/gm; let m;
    while ((m = re.exec(md))) {
      const t = m[2].trim();
      if (t) out.push({ title: t, anchorText: t, level: Math.min(3, m[1].length) });
    }
    return out;
  }
  function chaptersFromFb2(xml) {
    const doc = new DOMParser().parseFromString(xml, 'application/xml');
    if (doc.querySelector('parsererror')) return [];
    const out = [];
    doc.querySelectorAll('body section').forEach((sec) => {
      let titleEl = null;
      for (const child of sec.children) {
        if ((child.tagName || '').toLowerCase() === 'title') { titleEl = child; break; }
      }
      if (!titleEl) return;
      const t = (titleEl.textContent || '').replace(/\s+/g, ' ').trim();
      if (t) out.push({ title: t, anchorText: t, level: 1 });
    });
    if (out.length) return out;
    doc.querySelectorAll('body title').forEach((tEl) => {
      const t = (tEl.textContent || '').replace(/\s+/g, ' ').trim();
      if (t) out.push({ title: t, anchorText: t, level: 1 });
    });
    return out;
  }
  function chaptersFromEpubSpine(spineHtmlArr) {
    const out = [];
    spineHtmlArr.forEach(html => {
      const doc = new DOMParser().parseFromString(html, 'text/html');
      doc.querySelectorAll('h1, h2, h3, h4').forEach((h) => {
        if (h.closest('nav')) return;
        const t = (h.textContent || '').replace(/\s+/g, ' ').trim();
        if (!t) return;
        const tag = (h.tagName || '').toUpperCase();
        const lvl = tag === 'H1' ? 1 : tag === 'H2' ? 2 : 3;
        out.push({ title: t, anchorText: t, level: lvl });
      });
    });
    return out;
  }
  function chaptersFromEpubNav(files, opfPath) {
    let baseDir = '';
    if (opfPath && opfPath.includes('/')) baseDir = opfPath.replace(/[^/]+$/, '');
    const findLocal = (suffixRe) => {
      if (baseDir) for (const n in files) {
        if (!n.startsWith(baseDir)) continue;
        if (suffixRe.test(n)) return n;
      }
      for (const n in files) if (suffixRe.test(n)) return n;
      return null;
    };
    const navPath = findLocal(/(^|\/)nav\.x?html?$/i);
    const ncxPath = findLocal(/(^|\/)toc\.ncx$/i);
    const out = [];
    if (ncxPath && files[ncxPath]) {
      try {
        const doc = new DOMParser().parseFromString(files[ncxPath], 'application/xml');
        doc.querySelectorAll('navPoint').forEach(np => {
          const label = np.querySelector('navLabel > text');
          const t = label ? label.textContent.replace(/\s+/g, ' ').trim() : '';
          if (t) out.push({ title: t, anchorText: t, level: 1 });
        });
      } catch (e) {}
    }
    if (navPath && files[navPath]) {
      try {
        const doc = new DOMParser().parseFromString(files[navPath], 'text/html');
        doc.querySelectorAll('nav a, nav li a').forEach(a => {
          const t = (a.textContent || '').replace(/\s+/g, ' ').trim();
          if (t) out.push({ title: t, anchorText: t, level: 1 });
        });
      } catch (e) {}
    }
    const seen = new Set(); const uniq = [];
    out.forEach(o => {
      const k = o.title.toLowerCase();
      if (!seen.has(k)) { seen.add(k); uniq.push(o); }
    });
    return uniq;
  }

  /* ==================== ВСТАВКА МАРКЕРОВ ==================== */
  function mapHeadersToParagraphs(paragraphs, structural) {
    const map = new Map();
    let ptr = 0;
    (structural || []).forEach((ch) => {
      const needle = (ch.anchorText || ch.title || '').replace(/\s+/g, ' ').trim().toLowerCase();
      if (!needle) return;
      let found = -1;
      for (let i = ptr; i < paragraphs.length; i++) {
        const hay = paragraphs[i].replace(/\s+/g, ' ').trim().toLowerCase();
        if (hay === needle) { found = i; break; }
      }
      if (found < 0) for (let i = ptr; i < paragraphs.length; i++) {
        const hay = paragraphs[i].replace(/\s+/g, ' ').trim().toLowerCase();
        if (hay.startsWith(needle) && hay.length < needle.length + 150) { found = i; break; }
      }
      if (found < 0) for (let i = ptr; i < paragraphs.length; i++) {
        const hay = paragraphs[i].replace(/\s+/g, ' ').trim().toLowerCase();
        if (hay.length < 200 && hay.includes(needle)) { found = i; break; }
      }
      if (found < 0) return;
      map.set(found, { title: ch.title || paragraphs[found], level: ch.level || 1 });
      ptr = found + 1;
    });
    return map;
  }

  function scoreHeading(line, prev, next) {
    const t = String(line || '').trim();
    if (!t) return 0;
    if (t.length > 120) return 0;
    if (/[.!?…,;:]$/.test(t)) return 0;
    let score = 0;
    if (/^(глава|часть|книга|том|пролог|эпилог|chapter|part|book|prologue|epilogue)\b/i.test(t)) score += 6;
    if (/^(\d+|[IVXLCDM]+)[\.\)]\s+\S/.test(t)) score += 2;
    if (/^§\s*\d+/.test(t)) score += 5;
    if (/^#{1,6}\s+/.test(t)) score += 3;
    if (t === t.toUpperCase() && /[А-ЯA-Z]/.test(t)) score += 3;
    if (t.length <= 50) score += 1;
    if (!String(prev || '').trim()) score += 1;
    if (!String(next || '').trim()) score += 1;
    if (/^(стр\.|page|©|copyright|isbn|удк|ббк)\b/i.test(t)) score -= 5;
    if (/^\d{1,2}[./-]\d{1,2}[./-]\d{2,4}$/.test(t)) score -= 6;
    if (/^[-–—•*]\s/.test(t)) score -= 3;
    return score;
  }
  function heuristicChapterMap(paragraphs) {
    const map = new Map();
    paragraphs.forEach((p, i) => {
      if (scoreHeading(p, paragraphs[i-1] || '', paragraphs[i+1] || '') >= 6) {
        map.set(i, { title: p.trim(), level: 1 });
      }
    });
    return map;
  }

  function packBook(rawText, structural) {
    const paragraphs = splitIntoParagraphs(normalizeRawText(rawText));
    if (!paragraphs.length || (paragraphs.length === 1 && !paragraphs[0])) {
      return { text: '', chapters: 0 };
    }
    let map = new Map();
    if (structural && structural.length) {
      map = mapHeadersToParagraphs(paragraphs, structural);
    }
    if (map.size === 0) {
      map = heuristicChapterMap(paragraphs);
    }
    if (map.size === 0) {
      map.set(0, { title: 'Книга целиком', level: 1 });
    }
    const out = paragraphs.map((p, i) => {
      const m = map.get(i);
      if (m) return makeChapterMarker(m.level, m.title) + p;
      return p;
    });
    return { text: out.join('\n\n'), chapters: map.size };
  }

  /* ==================== ОСНОВНОЙ ПАРСЕР ФАЙЛОВ ==================== */
  async function extractBook(file) {
    const ext = (file.name.match(/\.([^.]+)$/) || [,''])[1].toLowerCase();
    const buffer = await file.arrayBuffer();
    let text = '';
    let structural = [];
    let spineHtml = null;

    if (ext === 'epub') {
      const files = await unzip(buffer);
      let opfPath = null;
      for (const n in files) if (/\.opf$/i.test(n)) { opfPath = n; break; }
      const parts = [];
      spineHtml = [];
      if (opfPath && files[opfPath]) {
        const opfDoc = new DOMParser().parseFromString(files[opfPath], 'application/xml');
        const baseDir = opfPath.includes('/') ? opfPath.replace(/[^/]+$/, '') : '';
        const manifest = {};
        opfDoc.querySelectorAll('manifest > item, item').forEach(it => {
          const id = it.getAttribute('id'); const href = it.getAttribute('href');
          if (id && href) manifest[id] = href;
        });
        opfDoc.querySelectorAll('spine > itemref, itemref').forEach(ref => {
          const idref = ref.getAttribute('idref');
          if (idref && manifest[idref]) {
            let path = manifest[idref];
            try { path = decodeURIComponent(path); } catch (e) {}
            const full = baseDir + path;
            const raw = files[full] || files[path];
            if (!raw) return;
            if (/(^|\/)(nav|toc)\.x?html?$/i.test(path) || /(^|\/)titlepage/i.test(path)) return;
            const plain = textFromHtml(raw);
            if (plain) parts.push(plain);
            spineHtml.push(raw);
          }
        });
      }
      if (!parts.length) {
        for (const n in files) {
          if (!/\.x?html?$/i.test(n)) continue;
          if (/(^|\/)(nav|toc)\.x?html?$/i.test(n)) continue;
          if (!files[n]) continue;
          const plain = textFromHtml(files[n]);
          if (plain) parts.push(plain);
          spineHtml.push(files[n]);
        }
      }
      text = parts.join('\n\n');
      structural = chaptersFromEpubSpine(spineHtml);
      if (structural.length === 0) {
        structural = chaptersFromEpubNav(files, opfPath);
      }
    } else if (ext === 'fb2') {
      const raw = decodeBuffer(buffer);
      text = textFromFb2(raw);
      structural = chaptersFromFb2(raw);
    } else if (ext === 'html' || ext === 'htm' || ext === 'xhtml') {
      const raw = decodeBuffer(buffer);
      text = textFromHtml(raw);
      structural = chaptersFromHtml(raw);
    } else if (ext === 'md' || ext === 'markdown') {
      const raw = decodeBuffer(buffer);
      text = raw;
      structural = chaptersFromMarkdown(raw);
    } else if (ext === 'docx') {
      const files = await unzip(buffer);
      const xml = files['word/document.xml'];
      text = xml ? textFromDocx(xml) : '';
      structural = [];
    } else if (ext === 'odt') {
      const files = await unzip(buffer);
      const xml = files['content.xml'];
      text = xml ? textFromOdt(xml) : '';
      structural = [];
    } else if (ext === 'rtf') {
      text = textFromRtf(decodeBuffer(buffer));
      structural = [];
    } else if (ext === 'json') {
      text = textFromJson(decodeBuffer(buffer));
      structural = [];
    } else if (ext === 'csv') {
      text = textFromCsv(decodeBuffer(buffer));
      structural = [];
    } else if (ext === 'zip') {
      const files = await unzip(buffer);
      let chosen = null;
      for (const n in files) {
        if (/\.(txt|md|html?|fb2|docx|odt|json|csv|rtf)$/i.test(n)) { chosen = n; break; }
      }
      if (!chosen) throw new Error('Внутри ZIP нет читаемого файла');
      if (/\.x?html?$/i.test(chosen)) {
        text = textFromHtml(files[chosen]);
        structural = chaptersFromHtml(files[chosen]);
      } else if (/\.fb2$/i.test(chosen)) {
        text = textFromFb2(files[chosen]);
        structural = chaptersFromFb2(files[chosen]);
      } else if (/\.md$/i.test(chosen)) {
        text = files[chosen];
        structural = chaptersFromMarkdown(files[chosen]);
      } else {
        text = files[chosen];
      }
    } else {
      text = decodeBuffer(buffer);
      structural = [];
    }

    text = String(text || '').replace(/\u0000/g, '').replace(/\r\n?/g, '\n').replace(/[ \t]+\n/g, '\n').replace(/\n{4,}/g, '\n\n\n').trim();
    text = normalizeRawText(text);
    return { text, structural };
  }

  async function readFile(file) {
    toast('Обработка: ' + file.name);
    const baseName = file.name.replace(/\.[^.]+$/, '') || 'Без названия';
    try {
      const { text, structural } = await extractBook(file);
      if (!text) { toast('Не удалось извлечь текст', true); return; }
      const packed = packBook(text, structural);
      const title = baseName || guessTitle(text);
      const id = addBookRecord(title, packed.text, '');
      if (!id) return;
      if (window.__READER_UI__ && window.__READER_UI__.renderClassicLibrary) {
        window.__READER_UI__.renderClassicLibrary();
      }
      toast('Загружено: ' + title + ' · глав: ' + packed.chapters);
    } catch (err) {
      console.error(err);
      toast('Ошибка: ' + (err.message || err), true);
    }
  }

  function addBookRecord(title, text, categoryId) {
    const meta = loadMeta();
    let minOrder = 0;
    meta.forEach(b => { if (typeof b.order === 'number' && b.order < minOrder) minOrder = b.order; });
    const id = 'b' + Date.now() + Math.random().toString(36).slice(2, 7);
    const ok = setBookText(id, text.trim());
    if (!ok) return null;
    const cats = categoryId ? [categoryId] : [];
    meta.push({
      id, title: title || guessTitle(text),
      words: countWords(text), scroll: 0, chapter: -1, pct: 0,
      pIndex: 0, offsetInPara: 0,
      added: Date.now(), order: minOrder - 1,
      categories: cats
    });
    saveMeta(meta);
    return id;
  }

  window.__READER_CORE__ = {
    $, root, showError, toast, escapeHtml, formatDate, shade, mix, contrastColor, normalizeHex,
    askText, askLongText, askConfirm, openInlineDialog,
    DEFAULTS, FONT_STACKS, FONTS, PRESET_GROUPS,
    loadSettings, saveSettings, getSettings: () => settings, setSettings: (s) => { settings = s; },
    loadCustomPalettes, saveCustomPalettes,
    loadMeta, saveMeta, getBookText, setBookText,
    removeBookData, loadCategories, saveCategories, marksKey, loadMarks, saveMarks,
    sortBooks, guessTitle, countWords, splitIntoParagraphs, normalizeRawText,
    cleanHeadingForDisplay, readFile, addBookRecord,
    scoreHeading, heuristicChapterMap, mapHeadersToParagraphs,
    makeChapterMarker, parseChapterMarkers,
    packBook, extractBook,
    CUSTOM_PALETTES_KEY, META_KEY, TEXT_PREFIX, CATEGORIES_KEY
  };

  window.__READER_STATE__ = {
    currentBookId: null,
    currentMarks: [],
    chapters: [],
    chapterStarts: [],
    lastScrollMax: 0,
    activeChapter: -1,
    currentSearchHits: [],
    currentSearchIndex: -1,
    searchDebounceTimer: null,
    editingMarkId: null,
    pendingMarkAnchor: null,
    activeCategory: null,
    saveScrollTimer: null
  };
})();
</script>

  const tocClose = $('toc-close');

  function getActiveReaderEl() { return $('reader-screen'); }
  function getActiveContentEl() { return $('content'); }
  function getReaderScrollHeight() {
    const el = getActiveReaderEl(); if (!el) return 0;
    return Math.max(0, el.scrollHeight - el.clientHeight);
  }
  function getCurrentPercent() {
    const el = getActiveReaderEl(); if (!el) return 0;
    const max = el.scrollHeight - el.clientHeight;
    return max > 0 ? (el.scrollTop / max) * 100 : 0;
  }
  function captureReadingPosition() {
    const el = getActiveReaderEl(); const content = getActiveContentEl();
    if (!el || !content) return null;
    const y = el.scrollTop + 40;
    const paras = content.querySelectorAll('p:not(.chapter-title)');
    let targetIdx = -1, offsetInPara = 0;
    for (let i = 0; i < paras.length; i++) {
      const p = paras[i];
      if (p.offsetTop + p.offsetHeight > y) {
        targetIdx = parseInt(p.dataset.pIndex, 10);
        offsetInPara = Math.max(0, Math.min(p.offsetHeight, y - p.offsetTop));
        break;
      }
    }
    if (targetIdx < 0 && paras.length) { targetIdx = parseInt(paras[0].dataset.pIndex, 10) || 0; offsetInPara = 0; }
    const max = el.scrollHeight - el.clientHeight;
    return {
      pIndex: targetIdx, offsetInPara: offsetInPara, scrollTop: el.scrollTop,
      pct: max > 0 ? el.scrollTop / max : 0
    };
  }
  function restoreReadingPosition(pos) {
    if (!pos) return;
    const el = getActiveReaderEl(); const content = getActiveContentEl();
    if (!el || !content) return;
    const paras = content.querySelectorAll('p:not(.chapter-title)');
    const p = paras[pos.pIndex];
    if (p) {
      const target = Math.max(0, p.offsetTop + (pos.offsetInPara || 0) - 40);
      el.scrollTop = target;
    } else if (typeof pos.scrollTop === 'number') {
      el.scrollTop = pos.scrollTop;
    } else if (typeof pos.pct === 'number') {
      const max = el.scrollHeight - el.clientHeight;
      el.scrollTop = pos.pct * Math.max(0, max);
    }
  }

  /* ============ РЕНДЕР ============ */
  function renderBookIntoContent(markedText, contentEl) {
    if (!contentEl) return;
    contentEl.innerHTML = '';
    const raw = C.splitIntoParagraphs(C.normalizeRawText(markedText));
    const parsed = []; const chapters = [];
    raw.forEach((chunk) => {
      const m = chunk.match(/^\u0001CH:(\d+)\u0002([^\u0003]*)\u0003/);
      if (m) {
        const level = parseInt(m[1], 10) || 1;
        const title = m[2].trim();
        const rest = chunk.slice(m[0].length).trim();
        const pIdx = parsed.length;
        chapters.push({ index: chapters.length, title: title || ('Раздел ' + (chapters.length + 1)), level, pIndex: pIdx });
        if (rest) parsed.push(rest);
      } else {
        parsed.push(chunk);
      }
    });
    if (!chapters.length && parsed.length) {
      const hmap = C.heuristicChapterMap(parsed);
      if (hmap.size) {
        hmap.forEach((v, pIdx) => {
          chapters.push({ index: chapters.length, title: v.title, level: v.level, pIndex: pIdx });
        });
      } else {
        chapters.push({ index: 0, title: 'Книга целиком', level: 1, pIndex: 0 });
      }
    }
    chapters.sort((a, b) => a.pIndex - b.pIndex);
    chapters.forEach((c, i) => { c.index = i; });
    S.chapters = chapters;

    const chapterStartMap = new Map();
    chapters.forEach(ch => chapterStartMap.set(ch.pIndex, ch));

    const frag = document.createDocumentFragment();
    parsed.forEach((p, idx) => {
      const ch = chapterStartMap.get(idx);
      if (ch) {
        const head = document.createElement('p');
        head.className = 'chapter-title level-' + (ch.level || 1);
        head.textContent = C.cleanHeadingForDisplay(ch.title);
        head.dataset.chapter = ch.index;
        frag.appendChild(head);
      }
      const el = document.createElement('p');
      el.textContent = p;
      el.dataset.pIndex = idx;
      frag.appendChild(el);
    });
    contentEl.appendChild(frag);
    S.activeChapter = -1;
    measureChapterStarts(contentEl);
  }

  function measureChapterStarts(contentEl) {
    const content = contentEl || getActiveContentEl();
    const reader = getActiveReaderEl();
    if (!content || !reader) { S.chapterStarts = []; S.lastScrollMax = 0; return; }
    const baseTop = content.getBoundingClientRect().top;
    S.chapterStarts = S.chapters.map(ch => {
      const head = content.querySelector('[data-chapter="' + ch.index + '"]');
      if (!head) return 0;
      return head.getBoundingClientRect().top - baseTop;
    });
    S.lastScrollMax = Math.max(0, reader.scrollHeight - reader.clientHeight);
  }

  function getCurrentSnippet() {
    const el = getActiveReaderEl(); const content = getActiveContentEl();
    if (!el || !content) return { text:'',pIndex:0,offsetInPara:0,ratio:0,pos:0,pct:0 };
    const y = el.scrollTop + 40;
    const paras = content.querySelectorAll('p:not(.chapter-title)');
    let target = null, targetIndex = -1;
    for (let i = 0; i < paras.length; i++) {
      const p = paras[i];
      if (p.offsetTop + p.offsetHeight > y) { target = p; targetIndex = parseInt(p.dataset.pIndex, 10); break; }
    }
    if (!target && paras.length) { target = paras[0]; targetIndex = parseInt(paras[0].dataset.pIndex, 10) || 0; }
    if (!target) return { text:'',pIndex:0,offsetInPara:0,ratio:0,pos:0,pct:0 };
    const offsetInPara = Math.max(0, Math.min(target.offsetHeight, y - target.offsetTop));
    const ratio = offsetInPara / Math.max(1, target.offsetHeight);
    const text = (target.textContent || '').trim();
    const snippet = text.length > 140 ? text.slice(0, 140) + '…' : text;
    const max = getReaderScrollHeight();
    const pct = max > 0 ? el.scrollTop / max : 0;
    return { text: snippet, pIndex: targetIndex, offsetInPara, ratio, pos: el.scrollTop, pct };
  }

  /* ============ СОДЕРЖАНИЕ ============ */
  function computeChapterPercents() {
    if (!S.chapterStarts || !S.chapterStarts.length) measureChapterStarts();
    const max = Math.max(1, S.lastScrollMax || getReaderScrollHeight());
    return S.chapters.map((ch, i) => {
      const top = (S.chapterStarts && S.chapterStarts[i]) || 0;
      return Math.max(0, Math.min(100, (top / max) * 100));
    });
  }
  function renderTocList() {
    if (!tocList) return;
    tocList.innerHTML = '';
    if (!S.chapters.length) {
      const empty = document.createElement('div'); empty.id = 'toc-empty';
      empty.textContent = 'Главы не найдены.';
      tocList.appendChild(empty);
      return;
    }
    measureChapterStarts();
    const pcts = computeChapterPercents();
    S.chapters.forEach((ch, i) => {
      const item = document.createElement('div');
      item.className = 'toc-item' + (i === S.activeChapter ? ' active' : '') +
        (ch.level === 2 ? ' level-2' : ch.level === 3 ? ' level-3' : '');
      item.dataset.chapterIndex = i;
      const num = document.createElement('div');
      num.className = 'toc-num'; num.textContent = (i + 1);
      const title = document.createElement('div');
      title.className = 'toc-title';
      title.textContent = C.cleanHeadingForDisplay(ch.title);
      const pctEl = document.createElement('div');
      pctEl.className = 'toc-pct';
      pctEl.textContent = pcts[i].toFixed(1) + '%';
      pctEl.title = 'Начало главы — ' + pcts[i].toFixed(2) + '% книги';
      item.appendChild(num); item.appendChild(title); item.appendChild(pctEl);
      item.addEventListener('click', () => { scrollToChapter(i); closeToc(); });
      tocList.appendChild(item);
    });
  }
  function scrollToChapter(index) {
    if (index < 0 || index >= S.chapters.length) return;
    const ch = S.chapters[index];
    const content = getActiveContentEl(); if (!content) return;
    const el = content.querySelector('[data-chapter="' + ch.index + '"]');
    if (!el) return;
    const reader = getActiveReaderEl();
    const top = el.getBoundingClientRect().top - reader.getBoundingClientRect().top + reader.scrollTop - 20;
    reader.scrollTo({ top: Math.max(0, top), behavior: 'smooth' });
    S.activeChapter = index;
    updateTocActiveHighlight();
  }
  function updateTocActiveHighlight() {
    if (!tocList) return;
    const items = tocList.querySelectorAll('.toc-item');
    items.forEach((it, i) => it.classList.toggle('active', i === S.activeChapter));
    const activeEl = tocList.querySelector('.toc-item.active');
    if (activeEl && activeEl.scrollIntoView) activeEl.scrollIntoView({ block: 'nearest' });
  }
  function updateActiveChapter() {
    if (!S.chapters.length) return;
    const content = getActiveContentEl(); const reader = getActiveReaderEl();
    if (!content || !reader) return;
    const y = reader.scrollTop + 60;
    let active = -1;
    for (let i = 0; i < S.chapters.length; i++) {
      const el = content.querySelector('[data-chapter="' + S.chapters[i].index + '"]');
      if (!el) continue;
      if (el.offsetTop <= y) active = i;
    }
    if (active !== S.activeChapter) {
      S.activeChapter = active;
      if (tocPanel && tocPanel.classList.contains('open')) updateTocActiveHighlight();
    }
  }
  function openToc() {
    if (!S.currentBookId) { toast('Сначала откройте книгу', true); return; }
    renderTocList();
    tocPanel.classList.add('open'); tocOverlay.classList.add('open');
  }
  function closeToc() {
    tocPanel.classList.remove('open'); tocOverlay.classList.remove('open');
  }
  if (tocClose) tocClose.addEventListener('click', closeToc);
  if (tocOverlay) tocOverlay.addEventListener('click', closeToc);

  /* ============ ЗАКЛАДКИ ============ */
  function addMark() {
    if (!S.currentBookId) { toast('Сначала откройте книгу', true); return; }
    S.pendingMarkAnchor = getCurrentSnippet(); openNoteEditor(null);
  }
  function commitPendingMark(note) {
    if (!S.pendingMarkAnchor) return;
    const mark = Object.assign({}, S.pendingMarkAnchor, {
      id: 'm' + Date.now() + Math.random().toString(36).slice(2, 6),
      note: note || '', date: Date.now()
    });
    S.pendingMarkAnchor = null;
    S.currentMarks.push(mark); C.saveMarks(S.currentBookId, S.currentMarks);
    renderSideMarks(); renderMarksList();
    toast('Закладка сохранена');
  }
  function openNoteEditor(markId) {
    S.editingMarkId = markId;
    if (markId) {
      const m = S.currentMarks.find(x => x.id === markId); if (!m) return;
      noteTitle.textContent = 'Заметка к закладке';
      notePreview.textContent = m.text || ''; noteInput.value = m.note || '';
    } else if (S.pendingMarkAnchor) {
      noteTitle.textContent = 'Новая закладка — заметка';
      notePreview.textContent = S.pendingMarkAnchor.text || ''; noteInput.value = '';
    }
    noteEditor.classList.add('open');
    setTimeout(() => noteInput.focus(), 50);
  }
  function closeNoteEditor(save) {
    if (save) {
      const val = noteInput.value.trim();
      if (S.editingMarkId) {
        const m = S.currentMarks.find(x => x.id === S.editingMarkId);
        if (m) { m.note = val; C.saveMarks(S.currentBookId, S.currentMarks); renderMarksList(); }
      } else if (S.pendingMarkAnchor) commitPendingMark(val);
    } else S.pendingMarkAnchor = null;
    S.editingMarkId = null;
    noteEditor.classList.remove('open'); noteInput.value = '';
  }
  noteCancel.addEventListener('click', () => closeNoteEditor(false));
  noteSave.addEventListener('click', () => closeNoteEditor(true));
  noteEditor.addEventListener('click', (e) => { if (e.target === noteEditor) closeNoteEditor(false); });
  noteInput.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { e.preventDefault(); closeNoteEditor(false); }
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); closeNoteEditor(true); }
  });
  function removeMark(id) {
    S.currentMarks = S.currentMarks.filter(m => m.id !== id);
    C.saveMarks(S.currentBookId, S.currentMarks); renderSideMarks(); renderMarksList();
  }
  function clearMarks() {
    if (!S.currentMarks.length) return;
    askConfirm('Удалить все закладки этой книги?', 'Удалить', true).then(ok => {
      if (!ok) return;
      S.currentMarks = []; C.saveMarks(S.currentBookId, S.currentMarks); renderSideMarks(); renderMarksList();
    });
  }
  function renderMarksList() {
    if (!marksList) return;
    const query = (marksSearch && marksSearch.value || '').trim().toLowerCase();
    marksList.innerHTML = '';
    if (!S.currentMarks.length) {
      const empty = document.createElement('div'); empty.id = 'marks-empty';
      empty.textContent = 'Пока нет закладок. Нажмите 🔖.'; marksList.appendChild(empty); return;
    }
    const filtered = query ? S.currentMarks.filter(m =>
      (m.text || '').toLowerCase().includes(query) ||
      (m.note || '').toLowerCase().includes(query)) : S.currentMarks;
    if (!filtered.length) {
      const empty = document.createElement('div'); empty.id = 'marks-empty';
      empty.textContent = 'Ничего не найдено'; marksList.appendChild(empty); return;
    }
    const sorted = filtered.slice().sort((a, b) => {
      const ai = typeof a.pIndex === 'number' ? a.pIndex : 0;
      const bi = typeof b.pIndex === 'number' ? b.pIndex : 0;
      if (ai !== bi) return ai - bi;
      return (a.offsetInPara || 0) - (b.offsetInPara || 0);
    });
    sorted.forEach(m => {
      const el = document.createElement('div'); el.className = 'mark-item';
      const title = document.createElement('div'); title.className = 'mark-title';
      title.textContent = ((m.pct || 0) * 100).toFixed(2) + '%';
      const text = document.createElement('div'); text.className = 'mark-text';
      text.textContent = m.text || '(пусто)';
      el.appendChild(title); el.appendChild(text);
      if (m.note) {
        const note = document.createElement('div'); note.className = 'mark-note';
        note.textContent = m.note;
        note.addEventListener('click', (e) => { e.stopPropagation(); openNoteEditor(m.id); });
        el.appendChild(note);
      }
      const date = document.createElement('div'); date.className = 'mark-date'; date.textContent = formatDate(m.date);
      const del = document.createElement('button'); del.className = 'mark-del'; del.textContent = '✕';
      del.addEventListener('click', (e) => { e.stopPropagation(); removeMark(m.id); });
      el.appendChild(date); el.appendChild(del);
      el.addEventListener('click', () => { scrollToAnchor(m); closeMarks(); });
      marksList.appendChild(el);
    });
  }
  function renderSideMarks() {
    const sideMarks = $('side-marks'); if (!sideMarks) return;
    sideMarks.innerHTML = '';
    const total = getReaderScrollHeight(); if (total <= 0) return;
    S.currentMarks.forEach(m => {
      const mark = document.createElement('div'); mark.className = 'side-mark';
      const pct = Math.max(0, Math.min(1, m.pct || 0));
      mark.style.top = (pct * 100) + '%';
      mark.title = (m.text || '').slice(0, 60);
      sideMarks.appendChild(mark);
    });
  }
  function scrollToAnchor(item) {
    const el = getActiveReaderEl(); const content = getActiveContentEl();
    if (!el || !content) return;
    const paras = content.querySelectorAll('p:not(.chapter-title)');
    let top = 0;
    const p = paras[item.pIndex];
    if (p) {
      const h = Math.max(1, p.offsetHeight);
      let offset = item.offsetInPara;
      if (typeof offset !== 'number' || isNaN(offset)) offset = (item.ratio || 0) * h;
      offset = Math.min(offset, h); top = p.offsetTop + offset;
    } else top = item.pos || 0;
    el.scrollTo({ top, behavior: 'smooth' });
  }
  function openMarks() {
    if (!S.currentBookId) { toast('Сначала откройте книгу', true); return; }
    if (!marksPanel) return;
    renderMarksList(); marksPanel.classList.add('open'); marksOverlay.classList.add('open');
  }
  function closeMarks() {
    if (!marksPanel) return;
    marksPanel.classList.remove('open'); marksOverlay.classList.remove('open');
  }
  marksClose.addEventListener('click', closeMarks);
  marksOverlay.addEventListener('click', closeMarks);
  marksClear.addEventListener('click', clearMarks);
  marksSearch.addEventListener('input', renderMarksList);

  /* ============ ПОИСК ============ */
  function normalizeSearch(str) { return String(str).toLowerCase().replace(/ё/g, 'е'); }
  function findInBook(query) {
    const result = []; if (!query) return result;
    const q = normalizeSearch(query.trim()); if (!q) return result;
    const content = getActiveContentEl();
    if (!content) return result;
    const paras = content.querySelectorAll('p:not(.chapter-title)');
    const maxScroll = getReaderScrollHeight();
    for (let i = 0; i < paras.length; i++) {
      const p = paras[i]; const rawText = p.textContent || '';
      if (!rawText) continue;
      const hay = normalizeSearch(rawText); let from = 0;
      while (from <= hay.length) {
        const pos = hay.indexOf(q, from); if (pos === -1) break;
        const endPos = pos + q.length;
        const cStart = Math.max(0, pos - 60); const cEnd = Math.min(rawText.length, endPos + 60);
        const before = rawText.slice(cStart, pos); const hitText = rawText.slice(pos, endPos);
        const after = rawText.slice(endPos, cEnd);
        const prefix = cStart > 0 ? '…' : ''; const suffix = cEnd < rawText.length ? '…' : '';
        const snippet = prefix + before + '\u0001' + hitText + '\u0002' + after + suffix;
        let pct = 0;
        if (maxScroll > 0) {
          const h = Math.max(1, p.offsetHeight);
          const totalChars = Math.max(1, rawText.length);
          const fracInside = (pos + hitText.length / 2) / totalChars;
          const offset = Math.min(h, fracInside * h);
          pct = (p.offsetTop + offset) / maxScroll;
          pct = Math.max(0, Math.min(1, pct));
        }
        result.push({ pIndex: i, charStart: pos, charEnd: endPos, snippet, pct });
        from = pos + Math.max(1, q.length);
        if (result.length >= 300) return result;
      }
    }
    return result;
  }
  function renderSearchResults() {
    if (!searchResults) return;
    searchResults.innerHTML = '';
    if (!bookSearchInput || !bookSearchInput.value.trim()) {
      searchInputWrap.classList.remove('has-value'); searchMeta.textContent = '';
      const empty = document.createElement('div'); empty.id = 'search-empty';
      empty.textContent = 'Введите слово или фразу.'; searchResults.appendChild(empty); return;
    }
    searchInputWrap.classList.add('has-value');
    if (!S.currentSearchHits.length) {
      searchMeta.innerHTML = 'Ничего не найдено';
      const empty = document.createElement('div'); empty.id = 'search-empty';
      empty.textContent = 'По запросу «' + bookSearchInput.value.trim() + '» ничего нет.';
      searchResults.appendChild(empty); return;
    }
    const activeNum = S.currentSearchIndex >= 0 ? S.currentSearchIndex + 1 : 0;
    searchMeta.innerHTML = 'Найдено: <strong>' + S.currentSearchHits.length + '</strong>' +
      (activeNum ? ' · активный: <strong>' + activeNum + '</strong>' : '');
    S.currentSearchHits.forEach((h, idx) => {
      const el = document.createElement('div');
      el.className = 'search-item' + (idx === S.currentSearchIndex ? ' active' : '');
      const head = document.createElement('div'); head.className = 's-head';
      const chap = document.createElement('div'); chap.className = 's-chapter';
      const pct = document.createElement('span'); pct.className = 's-pct';
      pct.textContent = (h.pct * 100).toFixed(2) + '%';
      head.appendChild(chap); head.appendChild(pct);
      const text = document.createElement('div'); text.className = 's-text';
      const parts = h.snippet.split(/(\u0001|\u0002)/); let inside = false;
      parts.forEach(p => {
        if (p === '\u0001') { inside = true; return; }
        if (p === '\u0002') { inside = false; return; }
        if (!p) return;
        if (inside) { const m = document.createElement('mark'); m.textContent = p; text.appendChild(m); }
        else text.appendChild(document.createTextNode(p));
      });
      el.appendChild(head); el.appendChild(text);
      el.addEventListener('click', () => { scrollToSearchHit(idx); closeSearch(); });
      searchResults.appendChild(el);
    });
  }
  function scrollToSearchHit(index) {
    if (index < 0 || index >= S.currentSearchHits.length) return;
    const hit = S.currentSearchHits[index];
    const content = getActiveContentEl(); if (!content) return;
    const paras = content.querySelectorAll('p:not(.chapter-title)'); const el = paras[hit.pIndex]; if (!el) return;
    S.currentSearchIndex = index;
    el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    el.classList.add('find-hit'); setTimeout(() => el.classList.remove('find-hit'), 1200);
    renderSearchResults();
  }
  function openSearch() {
    if (!S.currentBookId) { toast('Сначала откройте книгу', true); return; }
    searchPanel.classList.add('open'); searchOverlay.classList.add('open');
    renderSearchResults();
    setTimeout(() => { if (bookSearchInput) { bookSearchInput.focus(); bookSearchInput.select(); } }, 60);
  }
  function closeSearch() {
    if (!searchPanel) return;
    searchPanel.classList.remove('open'); searchOverlay.classList.remove('open');
  }
  searchClose.addEventListener('click', closeSearch);
  searchOverlay.addEventListener('click', closeSearch);
  bookSearchClear.addEventListener('click', () => {
    bookSearchInput.value = ''; S.currentSearchHits = []; S.currentSearchIndex = -1;
    renderSearchResults(); bookSearchInput.focus();
  });
  bookSearchInput.addEventListener('input', () => {
    searchInputWrap.classList.toggle('has-value', !!bookSearchInput.value.trim());
    if (S.searchDebounceTimer) clearTimeout(S.searchDebounceTimer);
    S.searchDebounceTimer = setTimeout(() => {
      S.currentSearchHits = findInBook(bookSearchInput.value); S.currentSearchIndex = -1;
      renderSearchResults();
    }, 220);
  });
  bookSearchInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault(); if (!S.currentSearchHits.length) return;
      const next = S.currentSearchIndex < 0 ? 0 : (S.currentSearchIndex + 1) % S.currentSearchHits.length;
      scrollToSearchHit(next);
    }
    if (e.key === 'Escape') { e.preventDefault(); closeSearch(); }
  });

  /* ============ ПРОГРЕСС ============ */
  function scheduleSaveProgress() {
    if (!S.currentBookId) return;
    if (S.saveScrollTimer) clearTimeout(S.saveScrollTimer);
    S.saveScrollTimer = setTimeout(() => {
      const list = C.loadMeta();
      const idx = list.findIndex(x => x.id === S.currentBookId);
      if (idx < 0) return;
      const pos = captureReadingPosition();
      if (!pos) return;
      list[idx].scroll = pos.scrollTop;
      list[idx].pct = pos.pct;
      list[idx].pIndex = pos.pIndex;
      list[idx].offsetInPara = pos.offsetInPara;
      C.saveMeta(list);
    }, 400);
  }
  function updateSideThumb(pct) {
    const thumb = $('side-thumb'); const sp = $('side-progress');
    if (!thumb || !sp) return;
    if (window.getComputedStyle(sp).display === 'none') return;
    const trackH = sp.clientHeight;
    const thumbH = thumb.offsetHeight || 40;
    const usable = Math.max(1, trackH - thumbH);
    const y = (Math.max(0, Math.min(100, pct)) / 100) * usable;
    thumb.style.transform = 'translateY(' + y + 'px)';
  }
  function updateAllProgress() {
    const pct = getCurrentPercent();
    const pb = $('progress-bar'); if (pb) pb.style.width = pct + '%';
    const ind = $('pct-indicator'); if (ind) ind.textContent = pct.toFixed(2) + '%';
    const mInd = $('m-pct-indicator'); if (mInd) mInd.textContent = pct.toFixed(2) + '%';
    const mBar = $('m-pct-bar'); if (mBar) mBar.style.width = pct + '%';
    updateSideThumb(pct);
    scheduleSaveProgress();
    renderSideMarks();
    updateActiveChapter();
  }
  function showScroller() {
    const sp = $('side-progress'); if (!sp) return;

<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#14161a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>🕸️</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,700;1,400&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Courier+Prime:ital,wght@0,400;1,400&family=Crimson+Text:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:ital,wght@0,400;1,400&family=IBM+Plex+Sans:ital,wght@0,400;0,600;1,400&family=Inter:wght@400;600&family=JetBrains+Mono:wght@400;600&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,700;1,7..72,400&family=Lora:ital,wght@0,400;0,600;1,400&family=Manrope:wght@400;600&family=Merriweather:ital,wght@0,400;0,700;1,400&family=Montserrat:ital,wght@0,400;0,600;1,400&family=Noto+Sans:ital,wght@0,400;0,600;1,400&family=Noto+Serif:ital,wght@0,400;0,600;1,400&family=Nunito:ital,wght@0,400;0,600;1,400&family=Open+Sans:ital,wght@0,400;0,600;1,400&family=PT+Serif:ital,wght@0,400;0,700;1,400&family=Roboto:ital,wght@0,400;0,500;0,700;1,400&family=Rubik:ital,wght@0,400;0,600;1,400&family=Source+Sans+3:ital,wght@0,400;0,600;1,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=Spectral:ital,wght@0,400;0,600;1,400&display=swap">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --bg: #14161a; --bg-header: #191c21; --bg-panel: #1e2228; --bg-input: #191c21;
    --border: #23272e; --border-strong: #2e333b;
    --fg: #d4d7dc; --fg-dim: #6d737d; --fg-mid: #a8adb5;
    --accent: #8b919b; --accent-contrast: #14161a;
    --col-width: 720px; --line-height: 1.85; --letter-spacing: 0;
    --font-size: 20px;
    --font-stack: Georgia, 'Times New Roman', serif;
    --mark-color: #e0b84a;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --safe-left: env(safe-area-inset-left, 0px);
    --safe-right: env(safe-area-inset-right, 0px);
    --tap: 44px;
  }
  html, body { height: 100%; background: var(--bg); color: var(--fg);
    font-family: var(--font-stack); overflow: hidden;
    -webkit-text-size-adjust: 100%; text-size-adjust: 100%;
    overscroll-behavior: none; }
  #app { display: flex; flex-direction: column; height: 100%; width: 100%;
    padding-left: var(--safe-left); padding-right: var(--safe-right); }

  button, .btn, [role="button"] { background: var(--border); color: var(--fg);
    border: 1px solid var(--border-strong); padding: 8px 12px; border-radius: 8px;
    font-size: 13px; font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    cursor: pointer; line-height: 1.2; max-width: 100%; min-height: 36px;
    touch-action: manipulation; -webkit-user-select: none; user-select: none; }
  button:hover { background: var(--border-strong); }
  button:active { transform: translateY(1px); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  input[type=file] { display: none; }

  #boot-error { display: none; position: fixed; left: 12px; right: 12px; top: 12px;
    background: #3a1a1a; color: #ffd0d0; border: 1px solid #7a2a2a; border-radius: 8px;
    padding: 12px 14px; font-family: monospace; font-size: 12px; white-space: pre-wrap; z-index: 9999; }
  #file-toast { position: fixed; left: 50%; top: calc(16px + var(--safe-top)); transform: translateX(-50%);
    background: var(--bg-panel); border: 1px solid var(--border-strong); color: var(--fg);
    border-radius: 10px; padding: 10px 16px; font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    font-size: 13px; z-index: 10000; box-shadow: 0 8px 30px rgba(0,0,0,.5);
    display: none; max-width: min(90vw, 480px); text-align: center; line-height: 1.4; word-break: break-word; }
  #file-toast.show { display: block; }
  #file-toast.error { background: #3a1a1a; border-color: #7a2a2a; color: #ffd0d0; }

  .screen { flex: 1; display: none; overflow: hidden; position: relative; min-height: 0; }
  .screen.active { display: flex; }

  @media (hover: none) and (pointer: coarse) {
    * { scrollbar-width: none; -ms-overflow-style: none; }
    *::-webkit-scrollbar { width: 0; height: 0; display: none; }
  }
  .scroll-y { overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; min-height: 0; }

  .reader-text { overflow-wrap: anywhere; word-break: break-word; hyphens: auto; -webkit-hyphens: auto;
    font-size: var(--font-size); }
  .reader-text p { margin-bottom: 1.15em; text-indent: 2em; text-align: justify; orphans: 2; widows: 2; }
  .reader-text p:first-child { text-indent: 0; }
  .reader-text .chapter-title { text-indent: 0 !important; text-align: center;
    margin: 2.2em 0 1.4em; font-size: 1.1em; letter-spacing: 1px; font-weight: normal; }

  /* ====== БИБЛИОТЕКА (КЛАССИКА) ====== */
  #classic-root { flex-direction: column; min-height: 0; }
  #paste-screen { display: none; flex: 1; flex-direction: column; padding: 12px;
    align-items: center; overflow-y: auto; overflow-x: hidden; min-height: 0; -webkit-overflow-scrolling: touch; }
  #paste-screen.active { display: flex; }
  #paste-screen .inner { width: 100%; max-width: 860px; display: flex; flex-direction: column;
    min-height: 0; padding-bottom: calc(16px + var(--safe-bottom)); }
  #paste-screen p.lead { font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    font-size: 13px; color: var(--fg-dim); margin-bottom: 10px; text-align: center; }
  textarea#input { width: 100%; height: 160px; min-height: 120px; max-height: 220px;
    background: var(--bg-input); color: var(--fg);
    border: 1px solid var(--border-strong); border-radius: 8px; padding: 12px;
    font-size: 15px; line-height: 1.5; font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    resize: vertical; outline: none; max-width: 100%; }
  textarea#input:focus { border-color: var(--accent); }
  #paste-screen .actions { display: flex; justify-content: center; gap: 8px; margin-top: 10px;
    flex-wrap: wrap; flex-shrink: 0; }
  #paste-screen .actions button { min-height: var(--tap); font-size: 14px; padding: 10px 16px; }
  #library { margin-top: 16px; border-top: 1px solid var(--border); padding-top: 12px; }
  #library h3 { font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase;
    color: var(--fg-dim); margin-bottom: 10px; font-weight: normal;
    font-family: -apple-system, Segoe UI, Roboto, sans-serif; }
  #library-search-wrap { margin-bottom: 10px; display: flex; gap: 6px; align-items: center; }
  #library-search { flex: 1; min-width: 0; background: var(--bg-input); color: var(--fg);
    border: 1px solid var(--border-strong); border-radius: 8px; padding: 10px 12px;
    font-size: 14px; outline: none; font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    max-width: 100%; min-height: 40px; }
  #library-search:focus { border-color: var(--accent); }
  #library-search-clear { background: transparent; border: 1px solid var(--border-strong);
    color: var(--fg-dim); font-size: 14px; padding: 8px 10px; cursor: pointer; line-height: 1;
    border-radius: 8px; display: none; flex-shrink: 0; min-height: 40px; min-width: 40px; }
  #library-search-wrap.has-value #library-search-clear { display: block; }

  .book-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
  .book-item { background: var(--bg-panel); border: 1px solid var(--border-strong);
    border-radius: 10px; padding: 12px 14px 12px 34px; display: flex; flex-direction: column;
    gap: 5px; cursor: pointer; position: relative; transition: border-color .15s, background .15s;
    touch-action: pan-y; user-select: none; min-width: 0; }
  .book-item:hover { border-color: var(--accent); }
  .book-item .grip { position: absolute; left: 4px; top: 50%; transform: translateY(-50%);
    width: 24px; height: 40px; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 3px; cursor: grab; border-radius: 5px; touch-action: none; }
  .book-item .grip span { display: block; width: 13px; height: 2px; border-radius: 1px; background: var(--fg-dim); }
  .book-item .grip:hover { background: var(--border-strong); }
  .book-item .grip:hover span { background: var(--fg); }
  .book-item.dragging { opacity: .55; border-color: var(--accent); box-shadow: 0 8px 24px rgba(0,0,0,.45); }
  .book-item.drop-before { box-shadow: inset 3px 0 0 0 var(--accent); }
  .book-item.drop-after { box-shadow: inset -3px 0 0 0 var(--accent); }
  .book-item .title { font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    font-size: 14px; color: var(--fg); font-weight: 600; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; padding-right: 52px; min-width: 0; }
  .book-item .meta { font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    font-size: 11px; color: var(--fg-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* Категории в карточке книги */
  .book-item .book-categories { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 2px; }
  .book-item .cat-tag { font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    font-size: 10px; color: var(--accent); letter-spacing: .3px; text-transform: uppercase;
    padding: 2px 7px; border-radius: 8px;
    background: rgba(139,145,155,.12); border: 1px solid var(--border-strong);
    cursor: pointer; max-width: 100%; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; min-height: 22px; display: inline-flex; align-items: center; }
  .book-item .cat-tag:hover { border-color: var(--accent); }
  .book-item .cat-tag.none { color: var(--fg-dim); background: transparent; border-style: dashed; }
  .book-item .cat-tag .cat-x { margin-left: 4px; opacity: .6; }
  .book-item .cat-tag .cat-x:hover { opacity: 1; color: #ff9a9a; }

  .book-item .progress-line { height: 3px; border-radius: 2px; background: var(--border);
    overflow: hidden; margin-top: 2px; }
  .book-item .progress-line span { display: block; height: 100%; background: var(--accent); }
  .book-item .del, .book-item .rename { position: absolute; top: 6px; background: transparent;
    border: none; color: var(--fg-dim); font-size: 14px; padding: 4px 8px; line-height: 1;
    border-radius: 6px; cursor: pointer; min-height: 30px; min-width: 30px; }
  .book-item .del { right: 6px; }
  .book-item .rename { right: 38px; font-size: 13px; }
  .book-item .del:hover { background: var(--border-strong); color: var(--fg); }
  .book-item .rename:hover { background: var(--border-strong); color: var(--accent); }
  #library-empty, #library-no-results { font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    font-size: 12px; color: var(--fg-dim); text-align: center; padding: 14px;
    border: 1px dashed var(--border-strong); border-radius: 8px; }
  #library-no-results { display: none; }
  #library-no-results.show { display: block; }

  /* Панель категорий-фильтров */
  #categories-bar { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; align-items: center; }
  .category-chip { display: inline-flex; align-items: center; gap: 6px;
    background: var(--bg-panel); border: 1px solid var(--border-strong); border-radius: 20px;
    padding: 6px 12px; font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    font-size: 12px; color: var(--fg-mid); cursor: pointer; user-select: none;
    transition: border-color .15s, color .15s, background .15s; max-width: 100%; min-height: 34px; }
  .category-chip > span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .category-chip:hover { border-color: var(--accent); color: var(--fg); }
  .category-chip.active { border-color: var(--accent); color: var(--fg); background: var(--border-strong); }
  .category-chip .count { font-size: 10px; color: var(--fg-dim); font-variant-numeric: tabular-nums; flex-shrink: 0; }
  .category-chip.active .count { color: var(--accent); }
  .category-chip .chip-actions { display: inline-flex; align-items: center; gap: 1px; flex-shrink: 0; }
  .category-chip .chip-edit, .category-chip .chip-del { background: transparent; border: none;
    color: var(--fg-dim); padding: 0 4px; font-size: 11px; line-height: 1; cursor: pointer;
    border-radius: 3px; flex-shrink: 0; min-height: 24px; min-width: 24px; }
  .category-chip .chip-edit:hover { color: var(--fg); background: var(--border); }
  .category-chip .chip-del:hover { color: #ff9a9a; background: #3a1a1a; }
  .category-chip.add-chip { border-style: dashed; color: var(--fg-dim); padding: 6px 12px; }
  .category-chip.add-chip:hover { color: var(--accent); border-color: var(--accent); }

  /* Меню категорий (множественный выбор) */
  #category-menu { position: fixed; z-index: 350; background: var(--bg-panel);
    border: 1px solid var(--border-strong); border-radius: 10px; padding: 6px;
    min-width: 200px; max-width: min(320px, calc(100vw - 24px)); max-height: 70vh; overflow-y: auto;
    box-shadow: 0 12px 40px rgba(0,0,0,.55); display: none;
    font-family: -apple-system, Segoe UI, Roboto, sans-serif; }
  #category-menu.show { display: block; }
  #category-menu .cm-title { font-size: 10px; letter-spacing: 1.2px; text-transform: uppercase;
    color: var(--fg-dim); padding: 6px 12px 4px; font-weight: 600; }
  #category-menu .cm-item { padding: 9px 12px; font-size: 13px; color: var(--fg-mid);
    border-radius: 6px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    min-height: 38px; display: flex; align-items: center; gap: 8px; }
  #category-menu .cm-item:hover { background: var(--border-strong); color: var(--fg); }
  #category-menu .cm-item.active { color: var(--accent); }
  #category-menu .cm-item .cm-check { width: 16px; height: 16px; border-radius: 4px;
    border: 1px solid var(--border-strong); display: inline-flex; align-items: center;
    justify-content: center; font-size: 11px; flex-shrink: 0; }
  #category-menu .cm-item.active .cm-check { background: var(--accent); color: var(--accent-contrast); border-color: var(--accent); }
  #category-menu .cm-sep { height: 1px; background: var(--border); margin: 6px 4px; }
  #category-menu .cm-item.danger { color: #c97a7a; }
  #category-menu .cm-item.danger:hover { background: #3a1a1a; color: #ffd0d0; }

  /* ====== ШАПКА ЧИТАЛКИ ====== */
  .reader-topbar {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 12px; padding-top: max(8px, var(--safe-top));
    background: var(--bg-header); border-bottom: 1px solid var(--border);
    flex-shrink: 0; min-height: 52px;
  }
  .reader-topbar .logo {
    display: flex; align-items: center; gap: 0;
    font-weight: 700; font-size: 15px; color: var(--fg);
    flex-shrink: 0; letter-spacing: -.3px;
  }
  .reader-topbar .pct {
    margin-left: auto; margin-right: 4px;
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums;
    color: var(--accent); background: var(--bg-panel);
    border: 1px solid var(--border-strong); border-radius: 8px;
    padding: 6px 10px; min-width: 64px; text-align: center;
    cursor: pointer; user-select: none; min-height: 34px;
    display: flex; align-items: center; justify-content: center;
  }
  .reader-topbar .settings-btn {
    background: var(--bg-panel); border: 1px solid var(--border-strong);
    color: var(--fg); width: 40px; height: 40px; border-radius: 10px;
    font-size: 18px; cursor: pointer; display: flex; align-items: center;
    justify-content: center; flex-shrink: 0;
  }
  .reader-topbar .settings-btn:hover { background: var(--border-strong); }

  /* ====== ЧИТАЛКА ====== */
  #reader-shell { display: none; flex-direction: column; flex: 1; overflow: hidden; min-height: 0; }
  #reader-shell.active { display: flex; }
  #reader-screen { flex: 1; overflow-y: auto; overflow-x: hidden; position: relative;
    min-height: 0; -webkit-overflow-scrolling: touch; }
  #content { max-width: var(--col-width); margin: 0 auto;
    padding: 24px 18px calc(80px + var(--safe-bottom));
    line-height: var(--line-height); color: var(--fg);
    letter-spacing: var(--letter-spacing); width: 100%; }

  /* ====== ПАНЕЛИ ====== */
  .panel { position: fixed; top: 0; right: 0; width: min(380px, 100vw); height: 100%;
    background: var(--bg-header); border-left: 1px solid var(--border);
    z-index: 300; transform: translateX(100%); transition: transform .25s ease;
    display: flex; flex-direction: column;
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    padding-top: var(--safe-top); padding-bottom: var(--safe-bottom); }
  .panel.open { transform: translateX(0); }
  .panel-header { padding: 14px 18px; border-bottom: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: center;
    font-size: 13px; color: var(--accent); letter-spacing: 1px; text-transform: uppercase;
    flex-shrink: 0; gap: 8px; min-height: 52px; }
  .panel-body { flex: 1; overflow-y: auto; padding: 8px 0; min-height: 0; -webkit-overflow-scrolling: touch; }
  .panel-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 299; display: none; }
  .panel-overlay.open { display: block; }

  .toc-item { padding: 12px 18px; font-size: 13px; color: var(--fg-mid);
    cursor: pointer; line-height: 1.4; border-left: 2px solid transparent;
    display: flex; justify-content: space-between; gap: 10px; align-items: baseline; min-height: 44px; }
  .toc-item:hover { background: var(--bg-panel); color: var(--fg); border-left-color: var(--accent); }
  .toc-item.active { color: var(--fg); border-left-color: var(--accent); }
  .toc-item .toc-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    flex: 1; min-width: 0; }
  .toc-item .toc-pct { font-size: 11px; color: var(--fg-dim);
    font-variant-numeric: tabular-nums; flex-shrink: 0; letter-spacing: .2px; }
  .toc-item.active .toc-pct { color: var(--accent); }
  #toc-empty { padding: 20px; font-size: 13px; color: var(--fg-dim); text-align: center; }

  #marks-header-actions { display: flex; gap: 6px; }
  #marks-header button { padding: 6px 10px; font-size: 12px; min-height: 34px; }
  #marks-search-wrap { padding: 8px 12px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
  #marks-search { width: 100%; background: var(--bg-input); color: var(--fg);
    border: 1px solid var(--border-strong); border-radius: 8px; padding: 9px 12px;
    font-size: 13px; outline: none; font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    min-height: 38px; }
  #marks-search:focus { border-color: var(--accent); }
  #marks-list { flex: 1; overflow-y: auto; padding: 8px 0; min-height: 0; -webkit-overflow-scrolling: touch; }
  .mark-item { padding: 12px 18px; border-bottom: 1px solid var(--border);
    cursor: pointer; position: relative; transition: background .15s; }
  .mark-item:hover { background: var(--bg-panel); }
  .mark-item .mark-title { font-size: 12px; color: var(--fg-dim);
    text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; padding-right: 30px; }
  .mark-item .mark-text { font-size: 13px; color: var(--fg); line-height: 1.4;
    margin-bottom: 6px; display: -webkit-box; -webkit-line-clamp: 3;
    -webkit-box-orient: vertical; overflow: hidden; word-break: break-word; }
  .mark-item .mark-date { font-size: 10px; color: var(--fg-dim); }
  .mark-item .mark-note { font-size: 12px; color: var(--mark-color);
    background: rgba(224,184,74,.08); border-left: 2px solid var(--mark-color);
    padding: 6px 8px; border-radius: 3px; margin: 6px 0; line-height: 1.35;
    word-break: break-word; white-space: pre-wrap; }
  .mark-item .mark-del { position: absolute; top: 10px; right: 10px;
    background: transparent; border: none; color: var(--fg-dim); font-size: 14px;
    padding: 6px 10px; line-height: 1; border-radius: 4px; cursor: pointer;
    min-height: 32px; min-width: 32px; }
  .mark-item .mark-del:hover { background: var(--border-strong); color: var(--fg); }
  #marks-empty { padding: 24px 20px; font-size: 13px; color: var(--fg-dim);
    text-align: center; line-height: 1.5; }

  #search-panel { width: min(400px, 100vw); }
  #search-input-wrap { padding: 10px 14px; border-bottom: 1px solid var(--border);
    display: flex; gap: 6px; align-items: center; flex-shrink: 0; }
  #book-search-input { flex: 1; min-width: 0; background: var(--bg-input); color: var(--fg);
    border: 1px solid var(--border-strong); border-radius: 8px;
    padding: 9px 12px; font-size: 14px; outline: none;
    font-family: -apple-system, Segoe UI, Roboto, sans-serif; max-width: 100%; width: 100%; min-height: 38px; }
  #book-search-input:focus { border-color: var(--accent); }
  #book-search-clear { background: transparent; border: 1px solid var(--border-strong);
    color: var(--fg-dim); font-size: 14px; padding: 8px 10px; cursor: pointer;
    line-height: 1; border-radius: 8px; display: none; flex-shrink: 0; min-width: 38px; min-height: 38px; }
  #search-input-wrap.has-value #book-search-clear { display: block; }
  #search-meta { padding: 8px 14px 12px; font-size: 12px; color: var(--fg-dim);

  #note-editor.open { display: flex; }
  #note-editor .box { width: 100%; max-width: 480px; background: var(--bg-panel);

  #progress-bar { position: fixed; top: 0; left: 0; height: 2px;

  #side-progress { position: fixed; right: 6px; top: 60px; bottom: 40px;

  .sheet-section { margin-bottom: 14px; }

  .sheet-row .btn-group button { min-height: 40px; flex: 1; }

  #sheet-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.45);

  #sheet-overlay.open { opacity: 1; pointer-events: auto; }
  .m-pct-value { font-family: -apple-system, Segoe UI, Roboto, sans-serif;

  .cl-font-preview { display: flex; align-items: center;

  .cl-font-preview .aa { width: 40px; height: 40px;

  /* ====== INLINE-ДИАЛОГ ====== */
  #inline-dialog { position: fixed; inset: 0; z-index: 600; display: none;

  #inline-dialog .dlg { width: 100%; max-width: 420px; background: var(--bg-panel);

  #inline-dialog .dlg .actions .danger { background: #7a2a2a; border-color: #7a2a2a; color: #ffd0d0; }

  /* ====== АДАПТИВ ====== */
  @media (max-width: 1024px) {

<body>

<div id="boot-error"></div>
<div id="file-toast"></div>
<div id="progress-bar"></div>

<div id="app">
  <div id="classic-root" class="screen active">
    <div id="paste-screen" class="active">
      <div class="inner">
        <textarea id="input" placeholder="Сюда текст..." spellcheck="false"></textarea>
        <div class="actions">
          <button id="btn-read">Читать</button>
          <button id="btn-file">Загрузить файл</button>
          <button id="btn-clear">Очистить</button>
          <input type="file" id="file-input"
                 accept=".txt,.md,.markdown,.fb2,.html,.htm,.xhtml,.rtf,.docx,.odt,.epub,.zip,.json,.csv,text/plain,text/html,application/epub+zip,application/zip,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.oasis.opendocument.text,application/rtf,text/rtf">
        </div>
        <div id="library">
          <div id="categories-bar"></div>
          <div id="library-search-wrap">
            <input type="text" id="library-search" placeholder="Поиск по названию..." autocomplete="off">
            <button id="library-search-clear" title="Очистить">✕</button>
          </div>
          <div id="library-list" class="book-list"></div>
          <div id="library-no-results">Ничего не найдено</div>
        </div>
      </div>
    </div>
    <div id="reader-shell">
      <div class="reader-topbar">
        <div class="logo"><span>🕸️</span></div>
        <span class="pct" id="pct-indicator" title="Клик — перейти на любой процент">0.00%</span>
        <button class="settings-btn" id="btn-menu" title="Настройки">⚙</button>
      </div>
      <div id="reader-screen"><div id="content" class="reader-text"></div></div>
    </div>
  </div>

  <div id="toc-panel" class="panel">
    <div class="panel-header"><span>Содержание</span><button id="toc-close">✕</button></div>
    <div class="panel-body" id="toc-list"></div>
  </div>
  <div class="panel-overlay" id="toc-overlay"></div>

  <div id="marks-panel" class="panel">
    <div class="panel-header">
      <span>Закладки</span>
      <div id="marks-header-actions">
        <button id="marks-clear">Очистить</button>
        <button id="marks-close">✕</button>
      </div>
    </div>
    <div id="marks-search-wrap"><input type="text" id="marks-search" placeholder="Поиск по закладкам..." autocomplete="off"></div>
    <div class="panel-body" id="marks-list"></div>
  </div>
  <div class="panel-overlay" id="marks-overlay"></div>

  <div id="search-panel" class="panel">
    <div class="panel-header"><span>Поиск слова</span><div><button id="search-close">✕</button></div></div>
    <div id="search-input-wrap">
      <input type="text" id="book-search-input" placeholder="Слово или фраза…" autocomplete="off" spellcheck="false">
      <button id="book-search-clear" title="Очистить">✕</button>
    </div>
    <div id="search-meta"></div>
    <div class="panel-body" id="search-results"></div>
  </div>
  <div class="panel-overlay" id="search-overlay"></div>

  <div id="menu-pop"></div>
  <div id="drop-overlay">Отпустите файл, чтобы добавить книгу</div>
  <div id="category-menu"></div>
  <div id="pop-overlay"></div>

  <div id="note-editor">
    <div class="box">
      <h4 id="note-title">Заметка к закладке</h4>
      <div class="preview" id="note-preview"></div>
      <textarea id="note-input" placeholder="Ваш комментарий (необязательно)..." spellcheck="false"></textarea>
      <div class="actions">
        <button id="note-cancel">Отмена</button>
        <button id="note-save" class="primary">Сохранить</button>
      </div>
    </div>
  </div>

  <div id="side-progress"><div id="side-thumb"></div><div id="side-marks"></div></div>
</div>

<div id="sheet-overlay"></div>
<div id="mobile-sheet">
  <div id="sheet-handle"></div>

  <div class="sheet-section">
    <h5>Прогресс</h5>
    <div class="sheet-row">
      <div class="m-pct-track"><span class="m-pct-fill" id="m-pct-bar"></span></div>
      <span class="m-pct-value" id="m-pct-indicator">0.00%</span>
    </div>
  </div>

  <div class="sheet-section">
    <h5>Размер текста</h5>
    <div class="sheet-row">
      <div class="btn-group">
        <button id="m-font-dec">A−</button><span class="size-label" id="m-size-label">20</span><button id="m-font-inc">A+</button>
      </div>
    </div>
  </div>

  <div class="sheet-section">
    <h5>Ширина колонки</h5>
    <div class="sheet-row">
      <div class="btn-group">
        <button id="m-width-dec">↔−</button><span class="size-label" id="m-width-label">720</span><button id="m-width-inc">↔+</button>
      </div>
    </div>
  </div>

  <div class="sheet-section">
    <h5>Межстрочный интервал</h5>
    <div class="sheet-row">
      <div class="btn-group">
        <button id="m-lh-dec">⇕−</button><span class="size-label" id="m-lh-label">1.85</span><button id="m-lh-inc">⇕+</button>
      </div>
    </div>
  </div>

  <div class="sheet-section">
    <h5>Разделы</h5>
    <div class="sheet-grid">
      <button id="m-search">Поиск</button>
      <button id="m-font">Шрифт</button>
      <button id="m-theme">Цвет</button>
      <button id="m-toc">Содержание</button>
      <button id="m-mark" class="mark-btn">Сделать закладку</button>
      <button id="m-marks" class="mark-btn">Закладки</button>
      <button id="m-categories">Категории</button>
      <button id="m-add-book">＋ Книга</button>
      <button id="m-library" class="wide">Меню</button>
      <button id="m-close" class="wide">✕ Закрыть</button>
    </div>
  </div>
</div>

<div id="settings-modal">
  <div class="card">
    <div class="card-header">
      <h3 id="settings-modal-title">⚙</h3>
      <button id="settings-modal-close" style="background:transparent;border:none;color:var(--fg-dim);font-size:22px;cursor:pointer;">✕</button>
    </div>
    <div class="card-body" id="settings-modal-body"></div>
  </div>
</div>

<div id="inline-dialog">
  <div class="dlg">
    <h4 id="inline-dialog-title">Введите значение</h4>
    <input id="inline-dialog-input" type="text" autocomplete="off">
    <textarea id="inline-dialog-textarea" style="display:none;" spellcheck="false"></textarea>
    <div class="actions">
      <button id="inline-dialog-cancel">Отмена</button>
      <button id="inline-dialog-ok" class="primary">OK</button>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const qsa = (sel, root) => (root || document).querySelectorAll(sel);
  const root = document.documentElement;

  function showError(msg) {
    const box = $('boot-error'); if (!box) return;
    box.style.display = 'block'; box.textContent = 'Ошибка запуска:\n' + msg;
  }

      /^[IVXLCDM]{1,7}\.?\s*$/, /^\d+\.?\s*$/, /^#{1,3}\s+/, /^\*{3,}$/

    let targetIdx = -1, offsetInPara = 0;
    for (let i = 0; i < paras.length; i++) {
      const p = paras[i];
      if (p.offsetTop + p.offsetHeight > y) {
        targetIdx = i;
        offsetInPara = Math.max(0, Math.min(p.offsetHeight, y - p.offsetTop));
        break;
      }
    }
    if (targetIdx < 0 && paras.length) { targetIdx = 0; offsetInPara = 0; }
    const max = el.scrollHeight - el.clientHeight;

  // ===== ЗАКЛАДКИ =====

    const y = el.scrollTop + 40;

      const p = paras[i];

    }
    if (!target && paras.length) { target = paras[0]; targetIndex = 0; }
    if (!target) return { text:'',chapter:'',pIndex:0,offsetInPara:0,ratio:0,pos:0,pct:0 };

  function scrollToAnchor(item) {

  // ===== ПОИСК =====
  function normalizeSearch(str) { return String(str).toLowerCase().replace(/ё/g, 'е'); }
  function findInBook(query) {
    const result = []; if (!query) return result;
    const q = normalizeSearch(query.trim()); if (!q) return result;
    const content = getActiveContentEl();
    if (!content) return result;
    const paras = content.querySelectorAll('p');
    const maxScroll = getReaderScrollHeight();
    const chapterRanges = chapters.map(ch => ({ title: ch.title, startIndex: ch.pIndex }));
    function chapterForPara(pIndex) {
      let title = '';
      for (let i = 0; i < chapterRanges.length; i++) {
        if (chapterRanges[i].startIndex <= pIndex) title = chapterRanges[i].title; else break;
      }
      return title;
    }
    for (let i = 0; i < paras.length; i++) {
      const p = paras[i]; const rawText = p.textContent || '';
      if (!rawText) continue;
      const hay = normalizeSearch(rawText); let from = 0;
      while (from <= hay.length) {
        const pos = hay.indexOf(q, from); if (pos === -1) break;
        const endPos = pos + q.length;
        const cStart = Math.max(0, pos - 60); const cEnd = Math.min(rawText.length, endPos + 60);
        const before = rawText.slice(cStart, pos); const hitText = rawText.slice(pos, endPos);
        const after = rawText.slice(endPos, cEnd);
        const prefix = cStart > 0 ? '…' : ''; const suffix = cEnd < rawText.length ? '…' : '';
        const snippet = prefix + before + '\u0001' + hitText + '\u0002' + after + suffix;
        let pct = 0;
        if (maxScroll > 0) {
          const h = Math.max(1, p.offsetHeight);
          const totalChars = Math.max(1, rawText.length);
          const fracInside = (pos + hitText.length / 2) / totalChars;
          const offset = Math.min(h, fracInside * h);
          pct = (p.offsetTop + offset) / maxScroll;
          pct = Math.max(0, Math.min(1, pct));
        }
        result.push({ pIndex: i, charStart: pos, charEnd: endPos, snippet, pct, chapter: chapterForPara(i) });
        from = pos + Math.max(1, q.length);
        if (result.length >= 300) return result;
      }
    }
    return result;
  }
  function renderSearchResults() {

      empty.textContent = 'Введите слово или фразу.'; searchResults.appendChild(empty); return;
    }
    searchInputWrap.classList.add('has-value');
    if (!currentSearchHits.length) {

  // ===== ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ ДЛЯ ПОПАПОВ =====
  const popOverlay = $('pop-overlay');

  function ensurePopOverlay() {
    if (!popOverlay) return;
    popOverlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:345;display:none;';
    popOverlay.addEventListener('click', () => {
      const catMenu = $('category-menu');
      const popMenu = $('menu-pop');
      if (catMenu) catMenu.classList.remove('show');
      if (popMenu) popMenu.classList.remove('show');
      popOverlay.style.display = 'none';
    });
  }
  ensurePopOverlay();

  function closeAllPopups() {
    const catMenu = $('category-menu');
    const popMenu = $('menu-pop');
    if (catMenu) catMenu.classList.remove('show');
    if (popMenu) popMenu.classList.remove('show');
    if (popOverlay) popOverlay.style.display = 'none';
  }

  function showPopOverlayFor(el) {
    if (!popOverlay || !el) return;
    const isMobile = window.innerWidth <= 768;
    if (isMobile) {
      popOverlay.style.display = 'block';
    }
  }

  // Глобальное закрытие меню
  document.addEventListener('click', (e) => {
    const catMenu = $('category-menu');
    const popMenu = $('menu-pop');
    if (catMenu && catMenu.classList.contains('show')) {
      if (!catMenu.contains(e.target) &&
          !(e.target.closest && e.target.closest('.cat-tag')) &&
          !(e.target.closest && e.target.closest('.category-chip'))) {
        catMenu.classList.remove('show');
        if (popOverlay && !popMenu?.classList.contains('show')) popOverlay.style.display = 'none';
      }
    }
    if (popMenu && popMenu.classList.contains('show')) {
      if (!popMenu.contains(e.target) &&
          !(e.target.closest && e.target.closest('.category-chip'))) {
        popMenu.classList.remove('show');
        if (popOverlay && !catMenu?.classList.contains('show')) popOverlay.style.display = 'none';
      }
    }
  });

  // Escape закрывает всё
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      closeAllPopups();
    }
  });

  // ===== МЕНЮ КНИГИ =====
  function showBookMenu(bookId, anchorEl) {
    const menu = $('category-menu'); if (!menu) return;
    closeAllPopups();
    const books = loadMeta(); const b = books.find(x => x.id === bookId);
    if (!b) return;
    const currentCats = Array.isArray(b.categories) ? b.categories.slice() : [];
    const cats = loadCategories();
    menu.innerHTML = '';

    // Шапка с кнопкой закрытия
    const head = document.createElement('div');
    head.className = 'cm-head';
    const headTitle = document.createElement('div');
    headTitle.className = 'cm-head-title';
    headTitle.textContent = b.title || 'Книга';
    head.appendChild(headTitle);
    const closeBtn = document.createElement('button');
    closeBtn.className = 'cm-close';
    closeBtn.textContent = '✕';
    closeBtn.title = 'Закрыть';
    closeBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      menu.classList.remove('show');
      if (popOverlay) popOverlay.style.display = 'none';
    });
    head.appendChild(closeBtn);
    menu.appendChild(head);

    function mkTitle(text) {
      const t = document.createElement('div'); t.className = 'cm-title'; t.textContent = text;
      menu.appendChild(t);
    }
    function mkSep() {
      const s = document.createElement('div'); s.className = 'cm-sep'; menu.appendChild(s);
    }

    // переименование
    const renameItem = document.createElement('div');
    renameItem.className = 'cm-item'; renameItem.textContent = '✎ Переименовать';
    renameItem.addEventListener('click', () => {
      menu.classList.remove('show');
      if (popOverlay) popOverlay.style.display = 'none';
      askText('Новое название:', b.title).then(n => {
        if (n !== null && n.trim()) {
          const arr = loadMeta(); const bk = arr.find(x => x.id === bookId);
          if (bk) bk.title = n.trim(); saveMeta(arr);
          renderClassicLibrary();
        }
      });
    });
    menu.appendChild(renameItem);

    mkSep();
    mkTitle('Категории (можно несколько)');

    if (!cats.length) {
      const empty = document.createElement('div');
      empty.className = 'cm-item';
      empty.style.cssText = 'color:var(--fg-dim);cursor:default;';
      empty.textContent = 'Нет категорий';
      menu.appendChild(empty);
    } else {
      cats.forEach(c => {
        const isActive = currentCats.includes(c.id);
        const item = document.createElement('div');
        item.className = 'cm-item' + (isActive ? ' active' : '');
        item.innerHTML = '<span class="cm-check">' + (isActive ? '✓' : '') + '</span><span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' + escapeHtml(c.name) + '</span>';
        item.addEventListener('click', (e) => {
          e.stopPropagation();
          const arr = loadMeta(); const bk = arr.find(x => x.id === bookId);
          if (!bk) return;
          if (!Array.isArray(bk.categories)) bk.categories = [];
          if (bk.categories.includes(c.id)) bk.categories = bk.categories.filter(id => id !== c.id);
          else bk.categories.push(c.id);
          saveMeta(arr);
          const nowActive = bk.categories.includes(c.id);
          item.classList.toggle('active', nowActive);
          item.querySelector('.cm-check').textContent = nowActive ? '✓' : '';
          renderClassicLibrary();
        });
        menu.appendChild(item);
      });
    }

    // создать новую категорию и сразу привязать
    const addCatItem = document.createElement('div');
    addCatItem.className = 'cm-item';
    addCatItem.textContent = '＋ Новая категория…';
    addCatItem.addEventListener('click', () => {
      menu.classList.remove('show');
      if (popOverlay) popOverlay.style.display = 'none';
      askText('Название новой категории:').then(n => {
        if (n !== null && n.trim()) {
          const arr = loadCategories();
          const id = 'c' + Date.now();
          arr.push({ id, name: n.trim(), created: Date.now() });
          saveCategories(arr);
          const bks = loadMeta(); const bk = bks.find(x => x.id === bookId);
          if (bk) {
            if (!Array.isArray(bk.categories)) bk.categories = [];
            if (!bk.categories.includes(id)) bk.categories.push(id);
            saveMeta(bks);
          }
          renderClassicLibrary();
        }
      });
    });
    menu.appendChild(addCatItem);

    mkSep();
    const delItem = document.createElement('div');
    delItem.className = 'cm-item danger';
    delItem.textContent = 'Удалить книгу';
    delItem.addEventListener('click', () => {
      menu.classList.remove('show');
      if (popOverlay) popOverlay.style.display = 'none';
      askConfirm('Удалить «' + b.title + '»?', 'Удалить', true).then(ok => {
        if (!ok) return;
        removeBookData(bookId);
        saveMeta(loadMeta().filter(x => x.id !== bookId));
        if (currentBookId === bookId) backClassic();
        renderClassicLibrary();
      });
    });
    menu.appendChild(delItem);

    const rect = anchorEl ? anchorEl.getBoundingClientRect() : { left: 20, bottom: 80, top: 60 };
    menu.style.left = Math.max(8, Math.min(window.innerWidth - 340, rect.left)) + 'px';
    menu.style.top = (rect.bottom + 6) + 'px';
    menu.classList.add('show');
    showPopOverlayFor(menu);
    setTimeout(() => {
      const mh = menu.offsetHeight || 280;
      if (rect.bottom + 6 + mh > window.innerHeight - 8) {
        menu.style.top = Math.max(8, (rect.top || 60) - mh - 6) + 'px';
      }
    }, 0);
  }

  // ===== КЛАССИКА: рендер библиотеки =====
  function renderClassicLibrary() {
    const libraryList = $('library-list'); if (!libraryList) return;
    renderCategoriesBar();
    const all = loadMeta(); const sorted = sortBooks(all);
    const searchEl = $('library-search');
    const query = (searchEl && searchEl.value || '').trim().toLowerCase();
    const wrap = $('library-search-wrap'); if (wrap) wrap.classList.toggle('has-value', !!query);

    let books = sorted;
    if (activeCategory === '') books = books.filter(b => !(b.categories || []).length);
    else if (activeCategory) books = books.filter(b => (b.categories || []).includes(activeCategory));
    const filtered = query ? books.filter(b => (b.title || '').toLowerCase().includes(query)) : books;

    libraryList.innerHTML = '';
    const noResults = $('library-no-results');
    if (!sorted.length) {
      if (noResults) noResults.classList.remove('show');
      const empty = document.createElement('div'); empty.id = 'library-empty';
      empty.textContent = 'Пока пусто. Добавьте книгу — она появится здесь.';
      libraryList.appendChild(empty); return;
    }
    if (!filtered.length) { if (noResults) noResults.classList.add('show'); return; }
    if (noResults) noResults.classList.remove('show');

    const cats = loadCategories();
    filtered.forEach(b => {
      const el = document.createElement('div');
      el.className = 'book-item'; el.dataset.bookId = b.id;
      const grip = document.createElement('div'); grip.className = 'grip';
      grip.title = 'Перетащите, чтобы изменить порядок';
      grip.innerHTML = '<span></span><span></span><span></span>';
      el.appendChild(grip);
      const title = document.createElement('div'); title.className = 'title'; title.textContent = b.title;
      el.appendChild(title);

      // теги категорий
      const catWrap = document.createElement('div');
      catWrap.className = 'book-categories';
      const bookCats = Array.isArray(b.categories) ? b.categories : [];
      if (!bookCats.length) {
        const tag = document.createElement('div');
        tag.className = 'cat-tag none';
        tag.textContent = 'Без категории';
        tag.addEventListener('click', (e) => { e.stopPropagation(); showBookMenu(b.id, tag); });
        catWrap.appendChild(tag);
      } else {
        bookCats.forEach(cid => {
          const cat = cats.find(c => c.id === cid);
          if (!cat) return;
          const tag = document.createElement('div');
          tag.className = 'cat-tag';
          tag.innerHTML = escapeHtml(cat.name) + ' <span class="cat-x" title="Убрать">✕</span>';
          tag.addEventListener('click', (e) => {
            e.stopPropagation();
            if (e.target.classList.contains('cat-x')) {
              const arr = loadMeta(); const bk = arr.find(x => x.id === b.id);
              if (bk) bk.categories = (bk.categories || []).filter(id => id !== cid);
              saveMeta(arr); renderClassicLibrary();
            } else showBookMenu(b.id, tag);
          });
          catWrap.appendChild(tag);
        });
        const addTag = document.createElement('div');
        addTag.className = 'cat-tag none';
        addTag.textContent = '＋';
        addTag.title = 'Добавить категорию';
        addTag.addEventListener('click', (e) => { e.stopPropagation(); showBookMenu(b.id, addTag); });
        catWrap.appendChild(addTag);
      }
      el.appendChild(catWrap);

      const meta = document.createElement('div'); meta.className = 'meta';
      let metaText = (b.words || countWords(getBookText(b.id))).toLocaleString('ru-RU') + ' слов';
      const marksCount = loadMarks(b.id).length;
      if (marksCount > 0) metaText += ' · 🔖 ' + marksCount;
      if (b.pct > 0) metaText += ' · ' + (b.pct * 100).toFixed(2) + '%';
      meta.textContent = metaText; el.appendChild(meta);
      if (b.pct > 0.00005) {
        const line = document.createElement('div'); line.className = 'progress-line';
        const span = document.createElement('span');
        span.style.width = Math.min(100, (b.pct || 0) * 100) + '%';
        line.appendChild(span); el.appendChild(line);
      }
      const rename = document.createElement('button');
      rename.className = 'rename'; rename.textContent = '✎';
      rename.addEventListener('click', (e) => {
        e.stopPropagation();
        askText('Новое название:', b.title).then(n => {
          if (n !== null && n.trim()) {
            const arr = loadMeta(); const bk = arr.find(x => x.id === b.id);
            if (bk) bk.title = n.trim(); saveMeta(arr); renderClassicLibrary();
          }
        });
      });
      el.appendChild(rename);
      const del = document.createElement('button');
      del.className = 'del'; del.textContent = '✕';
      del.addEventListener('click', (e) => {
        e.stopPropagation();
        askConfirm('Удалить «' + b.title + '»?', 'Удалить', true).then(ok => {
          if (!ok) return;
          removeBookData(b.id);

  // ===== Перетаскивание книг =====
  let dragState = null;
  function clearDragHighlights(container) {
    if (!container) return;

  }
  function findDropTarget(container, x, y, dragEl) {
    if (!container) return null;
    const els = Array.from(container.querySelectorAll('[data-book-id]')).filter(el => el !== dragEl);
    if (!els.length) return null;
    let best = null, bestDist = Infinity;
    for (const el of els) {
      const r = el.getBoundingClientRect();
      if (x >= r.left && x <= r.right && y >= r.top && y <= r.bottom) return { el, rect: r };
      const dx = x < r.left ? r.left - x : (x > r.right ? x - r.right : 0);
      const dy = y < r.top ? r.top - y : (y > r.bottom ? y - r.bottom : 0);
      const d = dx * dx + dy * dy;

    if (best && bestDist < 140 * 140) return best;
    return null;
  }
  function commitReorder(dragId, targetId, placeAfter) {
    const meta = loadMeta(); const list = sortBooks(meta);
    const dragIdx = list.findIndex(b => b.id === dragId); if (dragIdx < 0) return;
    const [moved] = list.splice(dragIdx, 1);
    let targetIdx = list.findIndex(b => b.id === targetId);
    if (targetIdx < 0) list.splice(dragIdx, 0, moved);
    else { if (placeAfter) targetIdx += 1; list.splice(targetIdx, 0, moved); }
    list.forEach((b, i) => { b.order = i; });

  function startBookDrag(e, bookEl, bookId, container) {
    if (dragState) return;

    try { bookEl.setPointerCapture && bookEl.setPointerCapture(e.pointerId); } catch (_) {}

      if (!dragState || ev.pointerId !== dragState.pointerId) return;
      const dx = ev.clientX - dragState.startX;
      const dy = ev.clientY - dragState.startY;
      if (!dragState.active) {
        if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
        dragState.active = true; dragState.el.classList.add('dragging');
        document.body.style.userSelect = 'none';
      }
      clearDragHighlights(container);
      const target = findDropTarget(container, ev.clientX, ev.clientY, dragState.el);
      if (target) {
        const midY = target.rect.top + target.rect.height / 2;
        target.el.classList.add(ev.clientY < midY ? 'drop-before' : 'drop-after');

      window.removeEventListener('pointercancel', onUp);
      dragState = null;
      if (wasActive && targetId && targetId !== dragId) commitReorder(dragId, targetId, placeAfter);
    };
    window.addEventListener('pointermove', onMove, { passive: false });
    window.addEventListener('pointerup', onUp);
    window.addEventListener('pointercancel', onUp);
  }

  // ===== ФАЙЛЫ =====
  function decodeBuffer(buffer) {
    const bytes = new Uint8Array(buffer);
    if (bytes.length >= 3 && bytes[0] === 0xEF && bytes[1] === 0xBB && bytes[2] === 0xBF)
      return new TextDecoder('utf-8').decode(bytes.subarray(3));
    if (bytes.length >= 2 && bytes[0] === 0xFF && bytes[1] === 0xFE)
      return new TextDecoder('utf-16le').decode(bytes.subarray(2));
    if (bytes.length >= 2 && bytes[0] === 0xFE && bytes[1] === 0xFF)

    try { utf8 = new TextDecoder('utf-8', { fatal: true }).decode(bytes); if (!utf8.includes('\uFFFD')) return utf8; } catch (e) {}
    try { const w = new TextDecoder('windows-1251').decode(bytes); if (w && !w.includes('\uFFFD')) return w; } catch (e) {}
    try { const k = new TextDecoder('koi8-r').decode(bytes); if (k && !k.includes('\uFFFD')) return k; } catch (e) {}

  async function unzip(arrayBuffer) {
    const bytes = new Uint8Array(arrayBuffer);
    const view = new DataView(arrayBuffer);
    const files = {};
    let eocd = -1;
    for (let i = bytes.length - 22; i >= Math.max(0, bytes.length - 65558); i--) {
      if (view.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
    }
    if (eocd < 0) throw new Error('Не найден ZIP-каталог');
    const cdOffset = view.getUint32(eocd + 16, true);
    const cdCount = view.getUint16(eocd + 10, true);
    let p = cdOffset;
    for (let i = 0; i < cdCount; i++) {
      if (view.getUint32(p, true) !== 0x02014b50) break;
      const compMethod = view.getUint16(p + 10, true);
      const compSize = view.getUint32(p + 20, true);
      const nameLen = view.getUint16(p + 28, true);
      const extraLen = view.getUint16(p + 30, true);
      const commentLen = view.getUint16(p + 32, true);
      const localOffset = view.getUint32(p + 42, true);
      const name = new TextDecoder('utf-8').decode(bytes.subarray(p + 46, p + 46 + nameLen));
      p += 46 + nameLen + extraLen + commentLen;
      const lhNameLen = view.getUint16(localOffset + 26, true);
      const lhExtraLen = view.getUint16(localOffset + 28, true);
      const dataStart = localOffset + 30 + lhNameLen + lhExtraLen;
      const dataEnd = dataStart + compSize;
      files[name] = { data: bytes.subarray(dataStart, dataEnd), compMethod };
    }
    const result = {};
    for (const name in files) {
      const f = files[name];
      try {
        if (f.compMethod === 0) {
          result[name] = decodeBuffer(f.data.buffer.slice(f.data.byteOffset, f.data.byteOffset + f.data.byteLength));
        } else if (f.compMethod === 8 && typeof DecompressionStream !== 'undefined') {
          const ds = new DecompressionStream('deflate-raw');
          const stream = new Blob([f.data]).stream().pipeThrough(ds);

        } else result[name] = '';

    }

  }
  function textFromHtml(html) {
    const doc = new DOMParser().parseFromString(html, 'text/html');

    body.querySelectorAll('br').forEach(br => br.replaceWith('\n'));

      n.appendChild(doc.createTextNode('\n\n'));

  }
  function textFromFb2(xml) {

    const out = [];
    body.querySelectorAll('section').forEach(sec => {
      sec.querySelectorAll('title').forEach(t => out.push('\n\n' + (t.textContent || '').trim() + '\n\n'));
      sec.querySelectorAll('p').forEach(p => { const t = (p.textContent || '').trim(); if (t) out.push(t + '\n\n'); });
    });
    if (!out.length) body.querySelectorAll('p').forEach(p => { const t = (p.textContent || '').trim(); if (t) out.push(t + '\n\n'); });
    return out.join('').replace(/\n{3,}/g, '\n\n').trim();
  }
  function textFromDocx(xml) {

    paras.forEach(p => {

      texts.forEach(t => { line += t.textContent; });
      if (line.trim()) out.push(line.trim());
    });
    return out.join('\n\n').replace(/\n{3,}/g, '\n\n').trim();
  }
  function textFromOdt(xml) {
    const doc = new DOMParser().parseFromString(xml, 'application/xml');

  function textFromRtf(rtf) {
    let text = rtf;
    text = text.replace(/\\fonttbl[\s\S]*?\}/g, '').replace(/\\colortbl[\s\S]*?\}/g, '')

  function textFromJson(json) {

  async function readFile(file) {
    toast('Обработка: ' + file.name);
    const name = file.name.replace(/\.[^.]+$/, '') || 'Без названия';
    const ext = (file.name.match(/\.([^.]+)$/) || [,''])[1].toLowerCase();
    try {
      const buffer = await file.arrayBuffer(); let text = '';
      if (ext === 'epub') {
        const files = await unzip(buffer);
        let opfPath = null;
        for (const n in files) if (/\.opf$/i.test(n)) { opfPath = n; break; }
        const parts = [];
        if (opfPath && files[opfPath]) {
          const opfDoc = new DOMParser().parseFromString(files[opfPath], 'application/xml');
          const baseDir = opfPath.includes('/') ? opfPath.replace(/[^/]+$/, '') : '';
          const manifest = {};
          opfDoc.querySelectorAll('manifest > item, item').forEach(it => {
            const id = it.getAttribute('id'); const href = it.getAttribute('href');
            if (id && href) manifest[id] = href;
          });
          opfDoc.querySelectorAll('spine > itemref, itemref').forEach(ref => {
            const idref = ref.getAttribute('idref');
            if (idref && manifest[idref]) {
              let path = manifest[idref];
              try { path = decodeURIComponent(path); } catch (e) {}
              const raw = files[baseDir + path] || files[path];
              if (raw) parts.push(textFromHtml(raw));
            }
          });
        }
        if (!parts.length) for (const n in files) if (/\.x?html?$/i.test(n)) parts.push(textFromHtml(files[n]));
        text = parts.join('\n\n');
      } else if (ext === 'docx') {
        const files = await unzip(buffer);
        const xml = files['word/document.xml'];
        text = xml ? textFromDocx(xml) : '';
      } else if (ext === 'odt') {
        const files = await unzip(buffer);
        const xml = files['content.xml'];
        text = xml ? textFromOdt(xml) : '';
      } else if (ext === 'fb2') {
        text = textFromFb2(decodeBuffer(buffer));
      } else if (ext === 'html' || ext === 'htm' || ext === 'xhtml') {
        text = textFromHtml(decodeBuffer(buffer));
      } else if (ext === 'rtf') {
        text = textFromRtf(decodeBuffer(buffer));
      } else if (ext === 'json') {
        text = textFromJson(decodeBuffer(buffer));
      } else if (ext === 'csv') {
        text = textFromCsv(decodeBuffer(buffer));
      } else if (ext === 'zip') {
        const files = await unzip(buffer);
        let chosen = null;
        for (const n in files) { if (/\.(txt|md|html?|fb2|docx|odt|epub|json|csv|rtf)$/i.test(n)) { chosen = n; break; } }
        if (!chosen) throw new Error('Внутри ZIP нет читаемого файла');
        if (/\.x?html?$/i.test(chosen)) text = textFromHtml(files[chosen]);
        else if (/\.fb2$/i.test(chosen)) text = textFromFb2(files[chosen]);
        else text = files[chosen];
      } else {
        text = decodeBuffer(buffer);
      }
      text = text.replace(/\u0000/g, '').replace(/\r\n?/g, '\n').replace(/[ \t]+\n/g, '\n').replace(/\n{4,}/g, '\n\n\n').trim();
      if (!text) { toast('Не удалось извлечь текст', true); return; }
      const cid = (typeof activeCategory === 'string' && activeCategory) ? activeCategory : '';
      const id = addBookRecord(name || guessTitle(text), text, cid);
      if (!id) return;
      renderClassicLibrary();
      toast('Загружено: ' + (name || guessTitle(text)));
    } catch (err) {
      console.error(err); toast('Ошибка: ' + (err.message || err), true);
    }
  }

  function openPctJump(anchorEl) {

        if (top + h > window.innerHeight - 8) el.style.top = Math.max(8, r.top - h - 8) + 'px';
      }, 0);
    }
    setTimeout(() => { input.focus(); input.select(); }, 50);
  }
  document.addEventListener('click', (e) => {
    const pctEl = $('pct-indicator'); const mPctEl = $('m-pct-indicator');
    if (e.target === pctEl) { e.stopPropagation(); openPctJump(pctEl); return; }
    if (e.target === mPctEl) { e.stopPropagation(); openPctJump(mPctEl); return; }
    if (pctJumpEl && pctJumpEl.style.display === 'flex') {
      if (pctJumpEl.contains(e.target)) return;
      pctJumpEl.style.display = 'none';
    }
  });

  // ===== ИНИЦИАЛИЗАЦИЯ =====
  function init() {
    loadMeta();
    applySettings();
    renderClassicLibrary();

    const btnRead = $('btn-read');
    if (btnRead) btnRead.addEventListener('click', async () => {
      const text = $('input').value;
      if (!text.trim()) { toast('Вставьте текст', true); return; }
      const id = addBookRecord(guessTitle(text), text);
      if (id) { $('input').value = ''; openBookClassic(id); }
    });
    const btnFile = $('btn-file'); const fileInput = $('file-input');
    if (btnFile && fileInput) {
      btnFile.addEventListener('click', () => fileInput.click());
      fileInput.addEventListener('change', (e) => {
        const f = e.target.files && e.target.files[0];
        if (f) readFile(f); fileInput.value = '';
      });
    }
    const btnClear = $('btn-clear');
    if (btnClear) btnClear.addEventListener('click', () => {
      const input = $('input');
      if (!input.value.trim()) { input.focus(); return; }
      askConfirm('Очистить поле?', 'Очистить', true).then(ok => {
        if (ok) { input.value = ''; input.focus(); }
      });
    });
    const libSearch = $('library-search');
    if (libSearch) libSearch.addEventListener('input', renderClassicLibrary);
    const libClear = $('library-search-clear');
    if (libClear) libClear.addEventListener('click', () => {
      $('library-search').value = ''; renderClassicLibrary(); $('library-search').focus();
    });

    const bindIf = (id, fn) => { const el = $(id); if (el) el.addEventListener('click', fn); };
    bindIf('btn-menu', openUnifiedSettings);

    bindIf('m-close', closeSheet);
    bindIf('m-search', () => { closeSheet(); setTimeout(openSearch, 180); });
    bindIf('m-toc', () => { closeSheet(); setTimeout(openToc, 180); });
    bindIf('m-marks', () => { closeSheet(); setTimeout(openMarks, 180); });
    bindIf('m-mark', () => { closeSheet(); addMark(); });
    bindIf('m-categories', () => { closeSheet(); setTimeout(openCategoriesManager, 180); });
    bindIf('m-library', () => { closeSheet(); backClassic(); });
    bindIf('m-theme', () => { closeSheet(); setTimeout(openPaletteOnly, 180); });
    bindIf('m-font', () => { closeSheet(); setTimeout(openFontsOnly, 180); });
    bindIf('m-add-book', () => { closeSheet(); setTimeout(promptAddBook, 180); });
    bindIf('m-font-dec', () => changeFont(-2)); bindIf('m-font-inc', () => changeFont(2));
    bindIf('m-width-dec', () => changeWidth(-40)); bindIf('m-width-inc', () => changeWidth(40));
    bindIf('m-lh-dec', () => changeLineHeight(-0.1)); bindIf('m-lh-inc', () => changeLineHeight(0.1));

    let dragCounter = 0;
    window.addEventListener('dragenter', (e) => {
      if (e.dataTransfer && Array.from(e.dataTransfer.types || []).includes('Files')) {
        dragCounter++; $('drop-overlay').classList.add('show');
      }
    });
    window.addEventListener('dragover', (e) => {
      if (e.dataTransfer) e.dataTransfer.dropEffect = 'copy'; e.preventDefault();
    });
    window.addEventListener('dragleave', () => {
      dragCounter = Math.max(0, dragCounter - 1);
      if (dragCounter === 0) $('drop-overlay').classList.remove('show');
    });
    window.addEventListener('drop', (e) => {
      e.preventDefault(); dragCounter = 0;
      $('drop-overlay').classList.remove('show');
      const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
      if (f) readFile(f);
    });

    document.addEventListener('keydown', (e) => {
      if (noteEditor && noteEditor.classList.contains('open')) return;
      if (inlineDlg && inlineDlg.classList.contains('open')) return;
      if (settingsModal && settingsModal.classList.contains('open')) {
        if (e.key === 'Escape') { e.preventDefault(); closeSettingsModal(); }
        return;
      }
      const ctrl = e.ctrlKey || e.metaKey;
      if (ctrl && (e.key === 'o' || e.key === 'O')) { e.preventDefault(); openToc(); }
      else if (ctrl && (e.key === 'f' || e.key === 'F')) { e.preventDefault(); openSearch(); }
      else if (ctrl && (e.key === 'b' || e.key === 'B')) { e.preventDefault(); addMark(); }
      else if (ctrl && (e.key === 'm' || e.key === 'M')) { e.preventDefault(); openMarks(); }
    });

    const rs = $('reader-screen');
    if (rs) rs.addEventListener('scroll', () => { updateAllProgress(); showScroller(); }, { passive: true });

    const sp = $('side-progress'); const sideThumb = $('side-thumb');
    if (sp && sideThumb) {
      let dragging = false;
      function scrollFromPointer(clientY) {
        const rect = sp.getBoundingClientRect(); const trackH = rect.height;
        const thumbH = sideThumb.offsetHeight || 40;
        const usable = Math.max(1, trackH - thumbH);
        let y = clientY - rect.top - thumbH / 2;
        y = Math.max(0, Math.min(usable, y));
        const pct = y / usable; const el = getActiveReaderEl(); if (!el) return;
        el.scrollTop = pct * (el.scrollHeight - el.clientHeight);
      }
      function startDrag(e) {
        if (window.getComputedStyle(sp).display === 'none') return;
        dragging = true; sp.classList.add('dragging', 'visible'); e.preventDefault();
        const y = e.touches ? e.touches[0].clientY : e.clientY; scrollFromPointer(y);
        document.addEventListener('mousemove', onDragMove, { passive: false });
        document.addEventListener('mouseup', endDrag);
        document.addEventListener('touchmove', onDragMove, { passive: false });
        document.addEventListener('touchend', endDrag);
        document.addEventListener('touchcancel', endDrag);
      }
      function onDragMove(e) {
        if (!dragging) return;
        const y = e.touches ? e.touches[0].clientY : e.clientY;
        scrollFromPointer(y); if (e.cancelable) e.preventDefault();
      }
      function endDrag() {
        if (!dragging) return; dragging = false;
        sp.classList.remove('dragging');
        document.removeEventListener('mousemove', onDragMove);
        document.removeEventListener('mouseup', endDrag);
        document.removeEventListener('touchmove', onDragMove);
        document.removeEventListener('touchend', endDrag);
        document.removeEventListener('touchcancel', endDrag);
        showScroller();
      }
      sp.addEventListener('mousedown', startDrag);
      sp.addEventListener('touchstart', startDrag, { passive: false });
      sp.addEventListener('mouseenter', () => { sp.classList.add('visible'); clearTimeout(sp._t); });
      sp.addEventListener('mouseleave', showScroller);
      sp.addEventListener('click', (e) => {
        if (window.getComputedStyle(sp).display === 'none') return;
        scrollFromPointer(e.clientY);
        updateAllProgress();
      });
    }

    window.addEventListener('orientationchange', () => {
      closeSheet();
      closeSettingsModal();
      closeAllPopups();
    });

    window.addEventListener('resize', () => {
      // На мобильных попапы центрируются, при ресайзе — прячем оверлей
      if (window.innerWidth > 768 && popOverlay) popOverlay.style.display = 'none';
    });
  }

  try { init(); } catch (err) {
    showError(err && err.message ? err.message : String(err));
    console.error(err);
  }
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YVL BOOKS</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🕸️%3C/text%3E%3C/svg%3E" type="image/svg+xml">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: Georgia, 'Times New Roman', serif;
    transition: background .2s, color .2s;
  }

  :root {
    --bg: #14161a;
    --bg-header: #191c21;
    --bg-panel: #1e2228;
    --bg-input: #191c21;
    --border: #23272e;
    --border-strong: #2e333b;
    --fg: #d4d7dc;
    --fg-dim: #6d737d;
    --fg-mid: #a8adb5;
    --accent: #8b919b;
    --col-width: 720px;
    --line-height: 1.85;
  }

  #app {
    display: flex;
    flex-direction: column;
    height: 100%;
  }

  header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 18px;
    background: var(--bg-header);
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
    flex-shrink: 0;
  }

  header h1 {
    font-size: 13px;
    font-weight: normal;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--fg-dim);
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    cursor: pointer;
  }

  .spacer { flex: 1; }

  button {
    background: var(--border);
    color: var(--fg);
    border: 1px solid var(--border-strong);
    padding: 7px 12px;
    border-radius: 6px;
    font-size: 13px;
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    cursor: pointer;
    transition: background .15s, border-color .15s;
    line-height: 1;
  }
  button:hover { background: var(--border-strong); }
  button:active { transform: translateY(1px); }

  .btn-group {
    display: flex;
    align-items: center;
    gap: 4px;
    background: var(--bg-panel);
    border: 1px solid var(--border-strong);
    border-radius: 8px;
    padding: 3px;
  }

  .btn-group button {
    background: transparent;
    border: none;
    padding: 6px 8px;
    border-radius: 5px;
    font-size: 13px;
  }
  .btn-group button:hover { background: var(--border-strong); }

  .btn-icon {
    font-family: Georgia, serif;
    font-weight: bold;
  }

  .size-label {
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    font-size: 11px;
    color: var(--fg-dim);
    min-width: 34px;
    text-align: center;
  }

  #paste-screen {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 24px;
    align-items: center;
    overflow-y: auto;
  }

  #paste-screen .inner {
    width: 100%;
    max-width: 860px;
    display: flex;
    flex-direction: column;
    flex: 1;
    min-height: 0;
  }

  #paste-screen p {
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    font-size: 13px;
    color: var(--fg-dim);
    margin-bottom: 12px;
    text-align: center;
  }

  textarea {
    flex: 1;
    width: 100%;
    min-height: 160px;
    background: var(--bg-input);
    color: var(--fg);
    border: 1px solid var(--border-strong);
    border-radius: 8px;
    padding: 18px;
    font-size: 15px;
    line-height: 1.6;
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    resize: none;
    outline: none;
  }
  textarea:focus { border-color: var(--accent); }

  #paste-screen .actions {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-top: 16px;
    flex-wrap: wrap;
    flex-shrink: 0;
  }

  #library {
    margin-top: 22px;
    border-top: 1px solid var(--border);
    padding-top: 18px;
  }

  #library h3 {
    font-size: 11px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--fg-dim);
    margin-bottom: 12px;
    font-weight: normal;
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
  }

  .library-search {
    width: 100%;
    background: var(--bg-input);
    color: var(--fg);
    border: 1px solid var(--border-strong);
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 13px;
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    outline: none;
    margin-bottom: 12px;
    transition: border-color .15s;
  }
  .library-search:focus { border-color: var(--accent); }
  .library-search::placeholder { color: var(--fg-dim); }

  .book-list {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 10px;
  }

  .book-item {
    background: var(--bg-panel);
    border: 1px solid var(--border-strong);
    border-radius: 8px;
    padding: 12px 14px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    cursor: pointer;
    transition: border-color .15s, transform .12s;
    position: relative;
  }
  .book-item:hover { border-color: var(--accent); transform: translateY(-1px); }

  .book-item .title {
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    font-size: 14px;
    color: var(--fg);
    font-weight: 600;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    padding-right: 22px;
  }

  .book-item .meta {
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    font-size: 11px;
    color: var(--fg-dim);
  }

  .book-item .del {
    position: absolute;
    top: 8px;
    right: 8px;
    background: transparent;
    border: none;
    color: var(--fg-dim);
    font-size: 14px;
    padding: 2px 6px;
    line-height: 1;
    border-radius: 4px;
    cursor: pointer;
  }
  .book-item .del:hover { background: var(--border-strong); color: var(--fg); }

  #library-empty {
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    font-size: 12px;
    color: var(--fg-dim);
    text-align: center;
    padding: 14px;
    border: 1px dashed var(--border-strong);
    border-radius: 8px;
  }

  #drop-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.65);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 500;
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    font-size: 18px;
    color: var(--fg);
    pointer-events: none;
    border: 2px dashed var(--accent);
  }
  #drop-overlay.show { display: flex; }

  #reader-screen {
    flex: 1;
    display: none;
    overflow-y: auto;
    overflow-x: hidden;
    scroll-behavior: smooth;
    position: relative;
  }

  #reader-screen::-webkit-scrollbar { width: 10px; }
  #reader-screen::-webkit-scrollbar-track { background: var(--bg); }
  #reader-screen::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 5px; }

  #content {
    max-width: var(--col-width);
    margin: 0 auto;
    padding: 50px 40px 140px;
    font-size: 20px;
    line-height: var(--line-height);
    color: var(--fg);
    hyphens: auto;
    -webkit-hyphens: auto;
    transition: max-width .15s, line-height .15s;
  }

  #content p {
    margin-bottom: 1.15em;
    text-indent: 2em;
    text-align: justify;
    orphans: 2;
    widows: 2;
  }

  #content p:first-child { text-indent: 0; }

  #progress-bar {
    position: fixed;
    top: 0; left: 0;
    height: 2px;
    background: var(--accent);
    width: 0%;
    z-index: 100;
    transition: width .1s;
  }

  #side-progress {
    position: fixed;
    right: 6px;
    top: 60px;
    bottom: 40px;
    width: 3px;
    background: var(--border);
    border-radius: 2px;
    z-index: 90;
    cursor: pointer;
  }

  #side-thumb {
    position: absolute;
    left: -3px;
    width: 9px;
    height: 40px;
    background: var(--accent);
    border-radius: 5px;
    opacity: .6;
    transition: opacity .15s;
  }
  #side-progress:hover #side-thumb { opacity: 1; }

  #to-top {
    position: fixed;
    right: 28px;
    bottom: 60px;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: var(--bg-panel);
    border: 1px solid var(--border-strong);
    color: var(--accent);
    cursor: pointer;
    display: none;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    z-index: 90;
  }
  #to-top:hover { background: var(--border-strong); color: var(--fg); }

  #jump-box {
    position: fixed;
    bottom: 70px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--bg-panel);
    border: 1px solid var(--border-strong);
    border-radius: 10px;
    padding: 14px 18px;
    display: none;
    gap: 10px;
    align-items: center;
    z-index: 200;
    box-shadow: 0 8px 30px rgba(0,0,0,.5);
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
  }

  #jump-box input {
    background: var(--bg);
    border: 1px solid var(--border-strong);
    color: var(--fg);
    padding: 7px 10px;
    border-radius: 6px;
    width: 130px;
    font-size: 13px;
    outline: none;
  }
  #jump-box input:focus { border-color: var(--accent); }

  #jump-box span {
    font-size: 12px;
    color: var(--fg-dim);
  }

  #toc-panel {
    position: fixed;
    top: 0;
    right: -360px;
    width: 360px;
    height: 100%;
    background: var(--bg-header);
    border-left: 1px solid var(--border);
    z-index: 300;
    transition: right .25s ease;
    display: flex;
    flex-direction: column;
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
  }
  #toc-panel.open { right: 0; }

  #toc-header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 13px;
    color: var(--accent);
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  #toc-header button { padding: 4px 10px; font-size: 12px; }

  #toc-list {
    flex: 1;
    overflow-y: auto;
    padding: 8px 0;
  }

  #toc-list::-webkit-scrollbar { width: 8px; }
  #toc-list::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 4px; }

  .toc-item {
    padding: 10px 20px;
    font-size: 13px;
    color: var(--fg-mid);
    cursor: pointer;
    line-height: 1.4;
    border-left: 2px solid transparent;
  }
  .toc-item:hover {
    background: var(--bg-panel);
    color: var(--fg);
    border-left-color: var(--accent);
  }
  .toc-item.active {
    color: var(--fg);
    border-left-color: var(--accent);
  }

  #toc-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.5);
    z-index: 299;
    display: none;
  }
  #toc-overlay.open { display: block; }

  #toc-empty {
    padding: 20px;
    font-size: 13px;
    color: var(--fg-dim);
    text-align: center;
    line-height: 1.5;
  }

  footer {
    padding: 8px 20px;
    background: var(--bg-header);
    border-top: 1px solid var(--border);
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    font-size: 11px;
    color: var(--fg-dim);
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-shrink: 0;
  }

  #hint {
    position: fixed;
    bottom: 50px;
    left: 20px;
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    font-size: 11px;
    color: var(--fg-dim);
    opacity: .6;
    z-index: 80;
    pointer-events: none;
    transition: opacity .3s;
  }

  .palette {
    position: absolute;
    top: 100%;
    right: 18px;
    margin-top: 6px;
    background: var(--bg-panel);
    border: 1px solid var(--border-strong);
    border-radius: 10px;
    padding: 12px;
    display: none;
    z-index: 250;
    box-shadow: 0 10px 30px rgba(0,0,0,.5);
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    width: 240px;
  }
  .palette.open { display: block; }

  .palette h4 {
    font-size: 10px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--fg-dim);
    margin-bottom: 10px;
    font-weight: normal;
  }

  .palette-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
    margin-bottom: 12px;
  }

  .palette-item {
    padding: 6px 4px;
    border-radius: 6px;
    border: 1px solid var(--border-strong);
    cursor: pointer;
    text-align: center;
    font-size: 10px;
    transition: transform .12s, border-color .15s;
  }
  .palette-item:hover { transform: translateY(-1px); border-color: var(--accent); }
  .palette-item.active { border-color: var(--accent); }
  .palette-item .sw {
    height: 22px;
    border-radius: 4px;
    margin-bottom: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: Georgia, serif;
    font-size: 13px;
  }

  .palette-custom {
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding-top: 10px;
    border-top: 1px solid var(--border);
  }

  .custom-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .custom-row label {
    font-size: 12px;
    color: var(--fg-mid);
    flex: 1;
  }
  .custom-row input[type=color] {
    width: 34px;
    height: 26px;
    border: 1px solid var(--border-strong);
    border-radius: 5px;
    background: var(--bg);
    cursor: pointer;
    padding: 2px;
  }
  .custom-row input[type=color]::-webkit-color-swatch-wrapper { padding: 0; }
  .custom-row input[type=color]::-webkit-color-swatch { border: none; border-radius: 3px; }

  .palette-reset {
    width: 100%;
    margin-top: 8px;
    font-size: 11px;
    padding: 6px;
  }

  input[type=file] { display: none; }

  /* ---------- Мобильные правки ---------- */
  @media (max-width: 768px) {
    #hint { display: none !important; }
    #content { padding: 30px 18px 120px; }
    #toc-panel { width: 88%; right: -100%; }
    header { padding: 8px 12px; gap: 6px; }
  }
</style>
</head>
<body>
<div id="progress-bar"></div>

<div id="app">

  <header style="position:relative">
    <h1 id="logo">YVL BOOKS</h1>
    <div class="spacer"></div>
    <div id="reader-controls" style="display:none; align-items:center; gap:8px; flex-wrap:wrap;">

      <div class="btn-group" title="Размер текста">
        <button id="font-dec" class="btn-icon" title="Уменьшить">A−</button>
        <span class="size-label" id="size-label">20</span>
        <button id="font-inc" class="btn-icon" title="Увеличить">A+</button>
      </div>

      <div class="btn-group" title="Ширина колонки">
        <button id="width-dec" class="btn-icon" title="Уже">↔−</button>
        <span class="size-label" id="width-label">720</span>
        <button id="width-inc" class="btn-icon" title="Шире">↔+</button>
      </div>

      <div class="btn-group" title="Межстрочный интервал">
        <button id="lh-dec" class="btn-icon" title="Плотнее">⇕−</button>
        <span class="size-label" id="lh-label">1.85</span>
        <button id="lh-inc" class="btn-icon" title="Просторнее">⇕+</button>
      </div>

      <button id="btn-theme">Цвет</button>
      <button id="btn-toc">Содержание</button>
      <button id="btn-library">Библиотека</button>
    </div>

    <div class="palette" id="palette">
      <h4>Готовые темы</h4>
      <div class="palette-grid" id="palette-grid"></div>
      <h4>Свои цвета</h4>
      <div class="palette-custom">
        <div class="custom-row"><label>Фон</label><input type="color" id="col-bg"></div>
        <div class="custom-row"><label>Текст</label><input type="color" id="col-fg"></div>
        <div class="custom-row"><label>Акцент</label><input type="color" id="col-accent"></div>
        <button class="palette-reset" id="reset-theme">Сбросить цвета</button>
      </div>
    </div>
  </header>

  <div id="paste-screen">
    <div class="inner">
      <p>Вставьте текст книги в поле ниже, загрузите файл или перетащите его в окно</p>
      <textarea id="input" placeholder="Сюда текст..." spellcheck="false" autocorrect="off" autocapitalize="off" autocomplete="off"></textarea>
      <div class="actions">
        <button id="btn-read">Читать</button>
        <button id="btn-file">Загрузить файл</button>
        <button id="btn-clear">Очистить</button>
        <input type="file" id="file-input" accept=".txt,.md,.fb2,.html,.htm,.epub,text/plain">
      </div>

      <div id="library">
        <h3>Библиотека</h3>
        <input type="text" id="library-search" class="library-search" placeholder="Поиск по названию..." autocomplete="off" spellcheck="false">
        <div id="library-list"></div>
      </div>
    </div>
  </div>

  <div id="reader-screen">
    <div id="content"></div>
  </div>

  <footer>
    <span id="footer-left"></span>
    <span id="footer-right"></span>
  </footer>
</div>

<div id="side-progress" style="display:none">
  <div id="side-thumb"></div>
</div>

<button id="to-top" title="Наверх">↑</button>

<div id="jump-box">
  <span>Перейти к главе:</span>
  <input type="number" id="jump-input" min="1" value="1">
  <button id="jump-go">→</button>
  <button id="jump-cancel">✕</button>
</div>

<div id="hint">Ctrl+G — глава · Ctrl+O — содержание · Ctrl +/− — размер</div>

<div id="toc-overlay"></div>
<div id="toc-panel">
  <div id="toc-header">
    <span>Содержание</span>
    <button id="toc-close">✕</button>
  </div>
  <div id="toc-list"></div>
</div>

<div id="drop-overlay">Отпустите файл, чтобы добавить книгу</div>

<script>
(function () {
  const root = document.documentElement;
  const pasteScreen = document.getElementById('paste-screen');
  const readerScreen = document.getElementById('reader-screen');
  const input = document.getElementById('input');
  const content = document.getElementById('content');
  const btnRead = document.getElementById('btn-read');
  const btnClear = document.getElementById('btn-clear');
  const btnFile = document.getElementById('btn-file');
  const fileInput = document.getElementById('file-input');
  const btnLibrary = document.getElementById('btn-library');
  const btnToc = document.getElementById('btn-toc');
  const btnTheme = document.getElementById('btn-theme');
  const readerControls = document.getElementById('reader-controls');
  const progressBar = document.getElementById('progress-bar');
  const footerLeft = document.getElementById('footer-left');
  const footerRight = document.getElementById('footer-right');
  const logo = document.getElementById('logo');

  const sideProgress = document.getElementById('side-progress');
  const sideThumb = document.getElementById('side-thumb');
  const toTop = document.getElementById('to-top');

  const jumpBox = document.getElementById('jump-box');
  const jumpInput = document.getElementById('jump-input');
  const jumpGo = document.getElementById('jump-go');
  const jumpCancel = document.getElementById('jump-cancel');

  const tocPanel = document.getElementById('toc-panel');
  const tocList = document.getElementById('toc-list');
  const tocClose = document.getElementById('toc-close');
  const tocOverlay = document.getElementById('toc-overlay');

  const palette = document.getElementById('palette');
  const paletteGrid = document.getElementById('palette-grid');
  const colBg = document.getElementById('col-bg');
  const colFg = document.getElementById('col-fg');
  const colAccent = document.getElementById('col-accent');
  const resetTheme = document.getElementById('reset-theme');

  const fontDec = document.getElementById('font-dec');
  const fontInc = document.getElementById('font-inc');
  const sizeLabel = document.getElementById('size-label');

  const widthDec = document.getElementById('width-dec');
  const widthInc = document.getElementById('width-inc');
  const widthLabel = document.getElementById('width-label');

  const lhDec = document.getElementById('lh-dec');
  const lhInc = document.getElementById('lh-inc');
  const lhLabel = document.getElementById('lh-label');

  const libraryList = document.getElementById('library-list');
  const librarySearch = document.getElementById('library-search');
  const dropOverlay = document.getElementById('drop-overlay');

  let chapters = [];
  let activeChapter = -1;
  let currentBookId = null;
  let libraryFilter = '';

  const DEFAULTS = {
    bg: '#14161a',
    fg: '#d4d7dc',
    accent: '#8b919b',
    fontSize: 20,
    colWidth: 720,
    lineHeight: 1.85
  };

  const PRESETS = [
    { name: 'Ночь',  bg: '#14161a', fg: '#d4d7dc', accent: '#8b919b' },
    { name: 'Уголь', bg: '#1a1a1a', fg: '#cccccc', accent: '#888888' },
    { name: 'Сепия', bg: '#f4ecd8', fg: '#3a3226', accent: '#8a7a5c' },
    { name: 'Крем',  bg: '#faf6ee', fg: '#2b2b2b', accent: '#8a8a8a' },
    { name: 'День',  bg: '#ffffff', fg: '#1a1a1a', accent: '#666666' },
    { name: 'Океан', bg: '#0f1a22', fg: '#c0d4e0', accent: '#5a7d94' },
    { name: 'Лес',   bg: '#131a15', fg: '#c8d4c8', accent: '#6d8a6d' },
    { name: 'Вино',  bg: '#1a1214', fg: '#d8c8cc', accent: '#8a6d75' },
    { name: 'Paper', bg: '#e8e4dc', fg: '#33302b', accent: '#7a736a' }
  ];

  // ---------- Настройки ----------
  function loadSettings() {
    try {
      const s = JSON.parse(localStorage.getItem('reader_settings') || '{}');
      return Object.assign({}, DEFAULTS, s);
    } catch (e) { return Object.assign({}, DEFAULTS); }
  }
  let settings = loadSettings();
  function saveSettings() {
    localStorage.setItem('reader_settings', JSON.stringify(settings));
  }

  function shade(hex, amt) {
    const n = hex.replace('#','');
    const num = parseInt(n.length === 3 ? n.split('').map(c=>c+c).join('') : n, 16);
    let r = (num >> 16) & 255, g = (num >> 8) & 255, b = num & 255;
    r = Math.max(0, Math.min(255, r + amt));
    g = Math.max(0, Math.min(255, g + amt));
    b = Math.max(0, Math.min(255, b + amt));
    return '#' + ((1<<24) + (r<<16) + (g<<8) + b).toString(16).slice(1);
  }

  function mix(c1, c2, t) {
    const p = (c) => {
      const n = c.replace('#','');
      const v = parseInt(n.length === 3 ? n.split('').map(x=>x+x).join('') : n, 16);
      return [(v>>16)&255, (v>>8)&255, v&255];
    };
    const a = p(c1), b = p(c2);
    const r = a.map((v,i)=>Math.round(v*(1-t) + b[i]*t));
    return '#' + r.map(x=>x.toString(16).padStart(2,'0')).join('');
  }

  function applySettings() {
    const { bg, fg, accent } = settings;
    root.style.setProperty('--bg', bg);
    root.style.setProperty('--fg', fg);
    root.style.setProperty('--accent', accent);
    root.style.setProperty('--bg-header', shade(bg, 6));
    root.style.setProperty('--bg-panel', shade(bg, 10));
    root.style.setProperty('--bg-input', shade(bg, 6));
    root.style.setProperty('--border', shade(bg, 14));
    root.style.setProperty('--border-strong', shade(bg, 22));
    root.style.setProperty('--fg-dim', mix(fg, bg, 0.55));
    root.style.setProperty('--fg-mid', mix(fg, bg, 0.25));

    root.style.setProperty('--col-width', settings.colWidth + 'px');
    root.style.setProperty('--line-height', settings.lineHeight);

    content.style.fontSize = settings.fontSize + 'px';
    sizeLabel.textContent = settings.fontSize;
    widthLabel.textContent = settings.colWidth;
    lhLabel.textContent = settings.lineHeight.toFixed(2);

    colBg.value = settings.bg;
    colFg.value = settings.fg;
    colAccent.value = settings.accent;

    document.querySelectorAll('.palette-item').forEach(el => {
      el.classList.toggle('active',
        el.dataset.bg === settings.bg &&
        el.dataset.fg === settings.fg &&
        el.dataset.accent === settings.accent
      );
    });

    setTimeout(updateProgress, 20);
  }

  function buildPresets() {
    paletteGrid.innerHTML = '';
    PRESETS.forEach(pr => {
      const el = document.createElement('div');
      el.className = 'palette-item';
      el.dataset.bg = pr.bg;
      el.dataset.fg = pr.fg;
      el.dataset.accent = pr.accent;
      el.innerHTML = `<div class="sw" style="background:${pr.bg};color:${pr.fg};border:1px solid ${shade(pr.bg,20)}">Aa</div>${pr.name}`;
      el.addEventListener('click', () => {
        settings.bg = pr.bg;
        settings.fg = pr.fg;
        settings.accent = pr.accent;
        saveSettings();
        applySettings();
      });
      paletteGrid.appendChild(el);
    });
  }

  function changeFont(delta) {
    let s = settings.fontSize + delta;
    s = Math.max(12, Math.min(48, s));
    settings.fontSize = s;
    saveSettings();
    applySettings();
  }
  fontDec.addEventListener('click', () => changeFont(-2));
  fontInc.addEventListener('click', () => changeFont(2));

  function changeWidth(delta) {
    let w = settings.colWidth + delta;
    w = Math.max(400, Math.min(1600, w));
    settings.colWidth = w;
    saveSettings();
    applySettings();
  }
  widthDec.addEventListener('click', () => changeWidth(-40));
  widthInc.addEventListener('click', () => changeWidth(40));

  function changeLineHeight(delta) {
    let lh = Math.round((settings.lineHeight + delta) * 100) / 100;
    lh = Math.max(1.2, Math.min(3.0, lh));
    settings.lineHeight = lh;
    saveSettings();
    applySettings();
  }
  lhDec.addEventListener('click', () => changeLineHeight(-0.1));
  lhInc.addEventListener('click', () => changeLineHeight(0.1));

  btnTheme.addEventListener('click', (e) => {
    e.stopPropagation();
    palette.classList.toggle('open');
  });
  document.addEventListener('click', (e) => {
    if (!palette.contains(e.target) && e.target !== btnTheme) {
      palette.classList.remove('open');
    }
  });
  palette.addEventListener('click', e => e.stopPropagation());

  colBg.addEventListener('input', e => { settings.bg = e.target.value; saveSettings(); applySettings(); });
  colFg.addEventListener('input', e => { settings.fg = e.target.value; saveSettings(); applySettings(); });
  colAccent.addEventListener('input', e => { settings.accent = e.target.value; saveSettings(); applySettings(); });

  resetTheme.addEventListener('click', () => {
    settings.bg = DEFAULTS.bg;
    settings.fg = DEFAULTS.fg;
    settings.accent = DEFAULTS.accent;
    saveSettings();
    applySettings();
  });

  // ---------- Разбиение на абзацы ----------
  function splitIntoParagraphs(text) {
    const blocks = text.split(/\n\s*\n/).map(b => b.trim()).filter(Boolean);
    if (blocks.length <= 1) {
      const lines = text.split('\n').map(l => l.trim()).filter(Boolean);
      if (lines.length > 1) return lines;
      return [text.trim()];
    }
    return blocks;
  }

  function isChapterTitle(text) {
    if (!text) return false;
    const t = text.trim();
    if (t.length > 90 || t.length < 2) return false;
    const patterns = [
      /^(глава|часть|книга|том|chapter|part|book|volume)\s+[\divxlcdm]+/i,
      /^[IVXLCDM]{1,7}\.?\s*$/,
      /^\d+\.?\s*$/,
      /^#{1,3}\s+/,
      /^\*{3,}$/
    ];
    for (const p of patterns) if (p.test(t)) return true;
    if (t.length < 70 && !/[.!?…]$/.test(t)) {
      const upperRatio = (t.match(/[А-ЯЁA-Z]/g) || []).length / Math.max(1, t.replace(/\s/g,'').length);
      if (upperRatio > 0.6) return true;
    }
    return false;
  }

  function render(text) {
    content.innerHTML = '';
    chapters = [];
    const paragraphs = splitIntoParagraphs(text);
    let chapterCount = 0;

    paragraphs.forEach(p => {
      const el = document.createElement('p');
      el.textContent = p;

      if (isChapterTitle(p)) {
        el.classList.add('chapter-title');
        el.style.cssText = 'text-indent:0; text-align:center; margin: 2.2em 0 1.4em; font-size: 1.1em; letter-spacing: 1px; color:' + mix(settings.fg, settings.bg, 0.3) + '; font-weight:normal;';
        chapterCount++;
        chapters.push({ title: p.trim(), el: el, num: chapterCount });
      }
      content.appendChild(el);
    });

    const words = text.trim().split(/\s+/).filter(Boolean).length;
    footerLeft.textContent = words.toLocaleString('ru-RU') + ' слов';
    footerRight.textContent = '≈ ' + Math.max(1, Math.round(words / 200)) + ' мин чтения';

    buildToc();
    updateProgress();
    readerScreen.scrollTop = 0;
  }

  // ---------- Прогресс ----------
  function updateProgress() {
    if (readerScreen.style.display === 'none') return;
    const scrollTop = readerScreen.scrollTop;
    const scrollHeight = readerScreen.scrollHeight - readerScreen.clientHeight;
    const pct = scrollHeight > 0 ? (scrollTop / scrollHeight) * 100 : 0;
    progressBar.style.width = pct + '%';

    const trackH = sideProgress.clientHeight;
    const thumbH = sideThumb.offsetHeight;
    const top = (pct / 100) * (trackH - thumbH);
    sideThumb.style.top = Math.max(0, Math.min(trackH - thumbH, top)) + 'px';

    toTop.style.display = scrollTop > 400 ? 'flex' : 'none';

    // подсветка активной главы
    if (chapters.length) {
      let current = 0;
      for (let i = 0; i < chapters.length; i++) {
        if (chapters[i].el.offsetTop - readerScreen.scrollTop <= 120) current = i;
      }
      if (current !== activeChapter) {
        activeChapter = current;
        document.querySelectorAll('.toc-item').forEach((el, i) => {
          el.classList.toggle('active', i === current);
        });
      }
    }
  }

  readerScreen.addEventListener('scroll', updateProgress);
  window.addEventListener('resize', updateProgress);

  sideProgress.addEventListener('click', (e) => {
    const rect = sideProgress.getBoundingClientRect();
    const pct = (e.clientY - rect.top) / rect.height;
    readerScreen.scrollTop = pct * (readerScreen.scrollHeight - readerScreen.clientHeight);
  });

  toTop.addEventListener('click', () => readerScreen.scrollTo({ top: 0, behavior: 'smooth' }));

  // ---------- Оглавление ----------
  function buildToc() {
    tocList.innerHTML = '';
    if (!chapters.length) {
      const empty = document.createElement('div');
      empty.id = 'toc-empty';
      empty.textContent = 'Главы не найдены. Разбейте текст заголовками вида «Глава 1» или пустыми строками.';
      tocList.appendChild(empty);
      return;
    }
    chapters.forEach((ch, i) => {
      const el = document.createElement('div');
      el.className = 'toc-item';
      el.textContent = ch.title;
      el.addEventListener('click', () => {
        readerScreen.scrollTo({ top: ch.el.offsetTop - 40, behavior: 'smooth' });
        closeToc();
      });
      tocList.appendChild(el);
    });
  }

  function openToc() {
    tocPanel.classList.add('open');
    tocOverlay.classList.add('open');
  }
  function closeToc() {
    tocPanel.classList.remove('open');
    tocOverlay.classList.remove('open');
  }
  btnToc.addEventListener('click', openToc);
  tocClose.addEventListener('click', closeToc);
  tocOverlay.addEventListener('click', closeToc);

  // ---------- Библиотека ----------
  function getLibrary() {
    try {
      return JSON.parse(localStorage.getItem('reader_library') || '[]');
    } catch (e) { return []; }
  }
  function saveLibrary(lib) {
    localStorage.setItem('reader_library', JSON.stringify(lib));
  }

  function renderLibrary() {
    const lib = getLibrary();
    libraryList.innerHTML = '';

    const query = libraryFilter.trim().toLowerCase();
    const filtered = query
      ? lib.filter(b => (b.title || '').toLowerCase().includes(query))
      : lib;

    if (!filtered.length) {
      const empty = document.createElement('div');
      empty.id = 'library-empty';
      empty.textContent = query ? 'Ничего не найдено' : 'Библиотека пуста';
      libraryList.appendChild(empty);
      return;
    }

    const list = document.createElement('div');
    list.className = 'book-list';

    filtered.forEach(book => {
      const item = document.createElement('div');
      item.className = 'book-item';

      const title = document.createElement('div');
      title.className = 'title';
      title.textContent = book.title;

      const meta = document.createElement('div');
      meta.className = 'meta';
      const words = (book.text || '').trim().split(/\s+/).filter(Boolean).length;
      meta.textContent = words.toLocaleString('ru-RU') + ' слов';

      const del = document.createElement('button');
      del.className = 'del';
      del.textContent = '✕';
      del.title = 'Удалить';
      del.addEventListener('click', (e) => {
        e.stopPropagation();
        const lib2 = getLibrary().filter(b => b.id !== book.id);
        saveLibrary(lib2);
        if (currentBookId === book.id) currentBookId = null;
        renderLibrary();
      });

      item.appendChild(title);
      item.appendChild(meta);
      item.appendChild(del);

      item.addEventListener('click', () => {
        currentBookId = book.id;
        openBook(book.text, book.title);
      });

      list.appendChild(item);
    });

    libraryList.appendChild(list);
  }

  librarySearch.addEventListener('input', (e) => {
    libraryFilter = e.target.value;
    renderLibrary();
  });

  // ---------- Открытие книги ----------
  function openBook(text, title) {
    if (!text || !text.trim()) return;
    pasteScreen.style.display = 'none';
    readerScreen.style.display = 'block';
    readerControls.style.display = 'flex';
    sideProgress.style.display = 'block';
    document.getElementById('hint').style.display = 'none';
    render(text);
    if (title) document.title = title + ' — YVL BOOKS';
    else document.title = 'YVL BOOKS';
  }

  function showLibraryScreen() {
    readerScreen.style.display = 'none';
    pasteScreen.style.display = 'flex';
    readerControls.style.display = 'none';
    sideProgress.style.display = 'none';
    progressBar.style.width = '0%';
    toTop.style.display = 'none';
    document.title = 'YVL BOOKS';
    renderLibrary();
  }

  // ---------- Кнопки ----------
  btnRead.addEventListener('click', () => {
    const text = input.value.trim();
    if (!text) return;
    // Сохраняем в библиотеку
    const lib = getLibrary();
    const title = text.split('\n')[0].trim().slice(0, 80) || 'Без названия';
    const id = 'book_' + Date.now();
    lib.unshift({ id, title, text, added: Date.now() });
    saveLibrary(lib);
    currentBookId = id;
    openBook(text, title);
  });

  btnClear.addEventListener('click', () => {
    input.value = '';
    input.focus();
  });

  btnFile.addEventListener('click', () => fileInput.click());

  fileInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    readFile(file);
    fileInput.value = '';
  });

  btnLibrary.addEventListener('click', showLibraryScreen);
  logo.addEventListener('click', showLibraryScreen);

  // ---------- Чтение файлов ----------
  function readFile(file) {
    const reader = new FileReader();
    const name = file.name.replace(/\.[^.]+$/, '');

    reader.onload = (e) => {
      let text = e.target.result;

      if (/\.(html?|fb2)$/i.test(file.name)) {
        const doc = new DOMParser().parseFromString(text, 'text/html');
        doc.querySelectorAll('script, style').forEach(el => el.remove());
        text = doc.body ? doc.body.innerText : text;
      }

      text = text.replace(/\r\n/g, '\n').replace(/\n{3,}/g, '\n\n').trim();
      if (!text) return;

      const lib = getLibrary();
      const id = 'book_' + Date.now();
      lib.unshift({ id, title: name || 'Без названия', text, added: Date.now() });
      saveLibrary(lib);
      currentBookId = id;
      openBook(text, name);
    };

    reader.readAsText(file, 'utf-8');
  }

  // ---------- Drag & Drop ----------
  let dragCounter = 0;
  window.addEventListener('dragenter', (e) => {
    e.preventDefault();
    dragCounter++;
    if (dragCounter === 1) dropOverlay.classList.add('show');
  });
  window.addEventListener('dragover', (e) => e.preventDefault());
  window.addEventListener('dragleave', (e) => {
    e.preventDefault();
    dragCounter--;
    if (dragCounter <= 0) { dragCounter = 0; dropOverlay.classList.remove('show'); }
  });
  window.addEventListener('drop', (e) => {
    e.preventDefault();
    dragCounter = 0;
    dropOverlay.classList.remove('show');
    const file = e.dataTransfer.files[0];
    if (file) readFile(file);
  });

  // ---------- Горячие клавиши ----------
  document.addEventListener('keydown', (e) => {
    if (e.ctrlKey && e.key.toLowerCase() === 'g') {
      e.preventDefault();
      if (readerScreen.style.display === 'block') {
        jumpBox.style.display = 'flex';
        jumpInput.focus();
        jumpInput.select();
      }
    }
    if (e.ctrlKey && e.key.toLowerCase() === 'o') {
      e.preventDefault();
      if (readerScreen.style.display === 'block') openToc();
    }
    if (e.ctrlKey && (e.key === '+' || e.key === '=')) {
      e.preventDefault();
      changeFont(2);
    }
    if (e.ctrlKey && e.key === '-') {
      e.preventDefault();
      changeFont(-2);
    }
    if (e.key === 'Escape') {
      jumpBox.style.display = 'none';
      closeToc();
    }
  });

  jumpGo.addEventListener('click', () => {
    const n = parseInt(jumpInput.value, 10);
    if (n >= 1 && n <= chapters.length) {
      readerScreen.scrollTo({ top: chapters[n-1].el.offsetTop - 40, behavior: 'smooth' });
    }
    jumpBox.style.display = 'none';
  });
  jumpCancel.addEventListener('click', () => jumpBox.style.display = 'none');
  jumpInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') jumpGo.click();
  });

  // ---------- Инициализация ----------
  buildPresets();
  applySettings();
  renderLibrary();
})();
</script>
</body>
</html>

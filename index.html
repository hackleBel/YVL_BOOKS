    if (window.matchMedia('(hover: none) and (pointer: coarse)').matches) return;
    sp.classList.add('visible');
    clearTimeout(sp._t);
    sp._t = setTimeout(() => { if (!sp.classList.contains('dragging')) sp.classList.remove('visible'); }, 500);
  }

  const mobileSheet = $('mobile-sheet');
  const sheetOverlay = $('sheet-overlay');
  const sheetHandle = $('sheet-handle');
  function closeSheet() { mobileSheet?.classList.remove('open'); sheetOverlay?.classList.remove('open'); }
  if (sheetOverlay) sheetOverlay.addEventListener('click', closeSheet);
  let sheetTouchStartY = null;
  if (sheetHandle) {
    sheetHandle.addEventListener('touchstart', (e) => { sheetTouchStartY = e.touches[0].clientY; }, { passive: true });
    sheetHandle.addEventListener('touchmove', (e) => {
      if (sheetTouchStartY === null) return;
      if (e.touches[0].clientY - sheetTouchStartY > 60) { closeSheet(); sheetTouchStartY = null; }
    }, { passive: true });
    sheetHandle.addEventListener('touchend', () => { sheetTouchStartY = null; });
  }
  function changeFont(delta) { settings.fontSize = Math.max(12, Math.min(48, settings.fontSize + delta)); saveSettings(); applySettings(); }
  function changeWidth(delta) { settings.colWidth = Math.max(400, Math.min(1600, settings.colWidth + delta)); saveSettings(); applySettings(); }
  function changeLineHeight(delta) { settings.lineHeight = Math.max(1.2, Math.min(3.0, Math.round((settings.lineHeight + delta) * 100) / 100)); saveSettings(); applySettings(); }

  function applySettings() {
    rootStyle(settings.bg, settings.fg, settings.accent);
    root.style.setProperty('--col-width', settings.colWidth + 'px');
    root.style.setProperty('--line-height', settings.lineHeight);
    root.style.setProperty('--letter-spacing', settings.letterSpacing.toFixed(2) + 'em');
    root.style.setProperty('--font-stack', C.FONT_STACKS[settings.fontFamily] || C.FONT_STACKS.serif);
    root.style.setProperty('--font-size', settings.fontSize + 'px');
    const msl = $('m-size-label'); if (msl) msl.textContent = settings.fontSize;
    const mwl = $('m-width-label'); if (mwl) mwl.textContent = settings.colWidth;
    const mll = $('m-lh-label'); if (mll) mll.textContent = settings.lineHeight.toFixed(2);
    if (S.currentBookId) {
      const text = C.getBookText(S.currentBookId);
      const target = $('content');
      if (target) {
        const savedPos = captureReadingPosition();
        const savedChapter = S.activeChapter;
        renderBookIntoContent(text, target);
        S.activeChapter = savedChapter;
        requestAnimationFrame(() => {
          if (savedPos) restoreReadingPosition(savedPos);
          updateAllProgress();
          measureChapterStarts();
          if (tocPanel && tocPanel.classList.contains('open')) renderTocList();
        });
      }
    }
    if ($('paste-screen') && $('paste-screen').classList.contains('active')) {
      renderClassicLibrary();
    }
  }
  function rootStyle(bg, fg, accent) {
    root.style.setProperty('--bg', bg); root.style.setProperty('--fg', fg); root.style.setProperty('--accent', accent);
    root.style.setProperty('--accent-contrast', contrastColor(accent));
    root.style.setProperty('--bg-header', shade(bg, 6));
    root.style.setProperty('--bg-panel', shade(bg, 10));
    root.style.setProperty('--bg-input', shade(bg, 6));
    root.style.setProperty('--border', shade(bg, 14));
    root.style.setProperty('--border-strong', shade(bg, 22));
    root.style.setProperty('--fg-dim', C.mix(fg, bg, 0.55));
    root.style.setProperty('--fg-mid', C.mix(fg, bg, 0.25));
  }

  /* ============ НАСТРОЙКИ ============ */
  const settingsModal = $('settings-modal');

  function addGroup(title) {

  }
  function makeColorEditor(label, key) {
    const wrap = document.createElement('div');
    wrap.className = 'color-editor';
    const initial = normalizeHex(settings[key]) || '#000000';
    const head = document.createElement('div'); head.className = 'ce-head';
    const lb = document.createElement('label'); lb.textContent = label;
    const swatch = document.createElement('div'); swatch.className = 'ce-swatch'; swatch.style.background = initial;
    const colorInput = document.createElement('input'); colorInput.type = 'color'; colorInput.value = initial;
    swatch.appendChild(colorInput);
    head.appendChild(lb); head.appendChild(swatch); wrap.appendChild(head);
    const hexRow = document.createElement('div'); hexRow.className = 'ce-hex';
    const hexInp = document.createElement('input'); hexInp.type = 'text'; hexInp.value = initial;
    hexInp.placeholder = '#rrggbb'; hexInp.autocomplete = 'off'; hexInp.spellcheck = false;
    hexRow.appendChild(hexInp); wrap.appendChild(hexRow);
    function syncVisual(hex) { swatch.style.background = hex; colorInput.value = hex; }
  function applyNow(hex) {
  const v = normalizeHex(hex); if (!v) return false;
  settings[key] = v; saveSettings();
  applySettings();  // ← полное применение с перерисовкой
  syncVisual(v); return true;
}
    colorInput.addEventListener('input', () => { const v = normalizeHex(colorInput.value); if (v) applyNow(v); });
    colorInput.addEventListener('change', () => { const v = normalizeHex(colorInput.value); if (v) applyNow(v); });
    hexInp.addEventListener('input', () => {
      const v = normalizeHex(hexInp.value);
      if (v) { hexInp.classList.remove('invalid'); settings[key] = v; saveSettings();
        rootStyle(normalizeHex(settings.bg) || '#000', normalizeHex(settings.fg) || '#fff', normalizeHex(settings.accent) || '#888');
        swatch.style.background = v; colorInput.value = v; }
      else hexInp.classList.add('invalid');
    });
    hexInp.addEventListener('blur', () => {
      const v = normalizeHex(hexInp.value);
      if (v) { settings[key] = v; saveSettings();
        rootStyle(normalizeHex(settings.bg) || '#000', normalizeHex(settings.fg) || '#fff', normalizeHex(settings.accent) || '#888');
        hexInp.value = v; hexInp.classList.remove('invalid'); syncVisual(v); }
      else { hexInp.value = normalizeHex(settings[key]) || '#000000'; hexInp.classList.remove('invalid'); }
    });
    hexInp.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); hexInp.blur(); } });
    return wrap;
  }

  /* ===== ПАЛИТРА: пресеты + пользовательские схемы ===== */
  function applyPalette(p) {

  function renderPresetRow(p) {
    const isActive = settings.bg === p.bg && settings.fg === p.fg && settings.accent === p.accent;
    const row = document.createElement('div');

  function renderCustomPaletteRow(p) {

  function openPaletteOnly() {
    if (!settingsModal) return;
    settingsModal.classList.add('open');
    settingsModalTitle.textContent = 'Цвет';
    settingsModalBody.innerHTML = '';

    /* --- Мои схемы (сохранённые пользователем) --- */
    const custom = C.loadCustomPalettes();
    addGroup('Мои схемы');
    if (!custom.length) {
      const empty = document.createElement('div');
      empty.style.cssText = 'padding:6px 16px 10px;font-size:12px;color:var(--fg-dim);line-height:1.4;';
      empty.textContent = 'Пока нет сохранённых схем. Настройте цвета ниже и нажмите «💾 Сохранить схему».';
      settingsModalBody.appendChild(empty);

      custom.forEach(p => settingsModalBody.appendChild(renderCustomPaletteRow(p)));

    /* --- Редактор цветов + кнопка сохранения --- */

    const saveWrap = document.createElement('div');

    saveBtn.textContent = '💾 Сохранить схему';
    saveBtn.addEventListener('click', () => {

    /* --- Встроенные пресеты --- */

  function openFontsOnly() {

  function openUnifiedSettings() {
    if (!settingsModal) return;
    settingsModal.classList.add('open');
    settingsModalTitle.textContent = '⚙';
    settingsModalBody.innerHTML = '';
    const rowsRead = document.createElement('div');

    };
    const mkStepper = (val, onChange) => {
      const w = document.createElement('div'); w.style.cssText = 'display:flex;align-items:center;gap:6px;';

    const wrapBtns = document.createElement('div');

      b.style.cssText = 'padding:12px 14px;border-radius:10px;font-size:14px;text-align:left;min-height:var(--tap);background:var(--bg-panel);border:1px solid var(--border-strong);color:var(--fg);cursor:pointer;';
      b.addEventListener('click', fn); libWrap.appendChild(b);

      mkBtn('Поиск слова', () => { closeSettingsModal(); setTimeout(openSearch, 180); });
      mkBtn('Сделать закладку', () => { closeSettingsModal(); setTimeout(addMark, 180); });

  /* ============ POPUP / МЕНЮ КАТЕГОРИЙ КНИГИ ============ */
  const popOverlay = $('pop-overlay');
  function ensurePopOverlay() {
    if (!popOverlay) return;
    popOverlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:345;display:none;';
    popOverlay.addEventListener('click', () => { closeAllPopups(); });
  }
  ensurePopOverlay();
  function closeAllPopups() {
    const catMenu = $('category-menu');
    const popMenu = $('menu-pop');
    if (catMenu) {
      catMenu.classList.remove('show');
      catMenu.style.display = '';       // сброс инлайнового display
      catMenu.style.left = '';
      catMenu.style.top = '';
      catMenu.style.transform = '';
      catMenu._anchor = null;
    }
    if (popMenu) popMenu.classList.remove('show');
    if (popOverlay) popOverlay.style.display = 'none';
    currentBookMenuId = null;
  }

  /* document click: закрываем меню только если клик ВНЕ меню/чипа */
  document.addEventListener('click', (e) => {
    const catMenu = $('category-menu');
    const popMenu = $('menu-pop');
    /* меню категорий книги: закрываем при любом клике вне самого меню.
       Клик по якорю (.cat-tag/.category-chip) тоже закрывает — но обработчик
       якоря тут же откроет меню заново, поэтому визуально всё ок. */
    if (catMenu && catMenu.classList.contains('show')) {
      if (!catMenu.contains(e.target)) {
        closeAllPopups();
      }
    }
    if (popMenu && popMenu.classList.contains('show')) {
      if (!popMenu.contains(e.target)) {
        closeAllPopups();
      }
    }
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeAllPopups(); });

  function promptAddCategory(bookId) {
    askText('Название новой категории:').then(n => {
      if (n === null) return;
      const name = String(n).trim();
      if (!name) return;
      const arr = C.loadCategories();
      const newCat = { id: 'c' + Date.now(), name, created: Date.now() };
      arr.push(newCat);
      C.saveCategories(arr);
      /* если добавляли из меню книги — сразу привяжем к ней */
      if (bookId) {
        const meta = C.loadMeta();
        const bk = meta.find(x => x.id === bookId);
        if (bk) {
          const list = Array.isArray(bk.categories) ? bk.categories.slice() : [];
          if (!list.includes(newCat.id)) list.push(newCat.id);
          bk.categories = list;
          C.saveMeta(meta);
        }
        renderClassicLibrary();
        showBookMenu(bookId, null, true);
        toast('Категория «' + name + '» добавлена книге');
      } else {
        renderClassicLibrary();
        toast('Категория создана');
      }
    });
  }

  /* ===== Новое меню «Категории книги» ===== */
  let currentBookMenuId = null;
  function showBookMenu(bookId, anchor, keepOpen) {
    const menu = $('category-menu'); if (!menu) return;
    const meta = C.loadMeta();
    const bk = meta.find(x => x.id === bookId);
    if (!bk) return;
    currentBookMenuId = bookId;
    if (!keepOpen) {
      /* позиционируем при первом открытии */
      menu._anchor = anchor || menu._anchor || null;
    }
    const cats = C.loadCategories();
    const bookCats = Array.isArray(bk.categories) ? bk.categories.slice() : [];
    menu.innerHTML = '';

    /* шапка с кнопкой закрытия */
    const header = document.createElement('div');
    header.className = 'cm-header';
    const title = document.createElement('div');
    title.className = 'cm-title'; title.textContent = 'Категории книги';
    const closeBtn = document.createElement('button');
    closeBtn.type = 'button'; closeBtn.textContent = '✕'; closeBtn.title = 'Закрыть';
    closeBtn.addEventListener('click', (e) => { e.stopPropagation(); closeAllPopups(); });
    header.appendChild(title); header.appendChild(closeBtn);
    menu.appendChild(header);

    /* список категорий */
    const listWrap = document.createElement('div');
    listWrap.className = 'cm-list';
    if (!cats.length) {
      const none = document.createElement('div');
      none.className = 'cm-item'; none.textContent = 'Нет категорий';
      listWrap.appendChild(none);
    }
    cats.forEach(c => {
      const active = bookCats.includes(c.id);
      const it = document.createElement('div');
      it.className = 'cm-item' + (active ? ' active' : '');
      const chk = document.createElement('span');
      chk.className = 'cm-check'; chk.textContent = active ? '✓' : '';
      const nm = document.createElement('span');
      nm.textContent = c.name; nm.style.flex = '1';
      it.appendChild(chk); it.appendChild(nm);
      it.addEventListener('click', (e) => {
        e.stopPropagation();
        /* переключаем категорию у книги, меню НЕ закрываем */
        const arr = C.loadMeta();
        const b = arr.find(x => x.id === bookId);
        if (!b) return;
        const list = Array.isArray(b.categories) ? b.categories.slice() : [];
        const idx = list.indexOf(c.id);
        if (idx >= 0) list.splice(idx, 1); else list.push(c.id);
        b.categories = list;
        C.saveMeta(arr);
        /* обновляем галочку на месте */
        const nowActive = list.includes(c.id);
        it.classList.toggle('active', nowActive);
        chk.textContent = nowActive ? '✓' : '';
        /* обновляем фон библиотеки, не трогая меню */
        renderLibraryListOnly();
      });
      listWrap.appendChild(it);
    });
    menu.appendChild(listWrap);

    /* разделитель + добавить */
    const sep = document.createElement('div'); sep.className = 'cm-sep'; menu.appendChild(sep);
    const add = document.createElement('div');
    add.className = 'cm-item'; add.textContent = '＋ Новая категория';
    add.addEventListener('click', (e) => {
      e.stopPropagation();
      /* меню оставляем открытым, диалог открывается поверх */
      promptAddCategory(bookId);
    });
    menu.appendChild(add);

    /* нижняя кнопка «Готово» */
    const footer = document.createElement('div');
    footer.className = 'cm-footer';
    const doneBtn = document.createElement('button');
    doneBtn.type = 'button'; doneBtn.textContent = 'Готово';
    doneBtn.addEventListener('click', (e) => { e.stopPropagation(); closeAllPopups(); });
    footer.appendChild(doneBtn);
    menu.appendChild(footer);

    /* позиционирование */
    const anchorEl = menu._anchor;
    menu.style.display = 'flex';
    if (anchorEl && !keepOpen) {
      const r = anchorEl.getBoundingClientRect();
      let left = r.left, top = r.bottom + 6;
      const w = Math.min(340, window.innerWidth - 24);
      const h = Math.min(menu.offsetHeight || 260, window.innerHeight - 24);
      if (left + w > window.innerWidth - 8) left = window.innerWidth - w - 8;
      if (top + h > window.innerHeight - 8) top = Math.max(8, r.top - h - 6);
      menu.style.left = Math.max(8, left) + 'px';
      menu.style.top = Math.max(8, top) + 'px';
    } else if (!menu.style.left) {
      menu.style.left = '50%';
      menu.style.top = '40%';
      menu.style.transform = 'translate(-50%, -50%)';
    }
    menu.classList.add('show');
    if (window.innerWidth <= 768 && popOverlay) popOverlay.style.display = 'block';
  }

  let dragState = null;
  function clearDragHighlights(container) {
    if (!container) return;
    container.querySelectorAll('.drop-before, .drop-after').forEach(el => el.classList.remove('drop-before', 'drop-after'));
  }
  function findDropTarget(container, x, y, dragEl) {
    if (!container) return null;
    const els = Array.from(container.querySelectorAll('[data-book-id]')).filter(el => el !== dragEl);
    if (!els.length) return null;
    let best = null, bestDist = Infinity;
    for (const el of els) {
      const r = el.getBoundingClientRect();
      if (x >= r.left && x <= r.right && y >= r.top && y <= r.bottom) return { el, rect: r };
      const dx = x < r.left ? r.left - x : (x > r.right ? x - r.right : 0);
      const dy = y < r.top ? r.top - y : (y > r.bottom ? y - r.bottom : 0);
      const d = dx * dx + dy * dy;
      if (d < bestDist) { bestDist = d; best = { el, rect: r }; }
    }
    if (best && bestDist < 140 * 140) return best;
    return null;
  }
  function commitReorder(dragId, targetId, placeAfter) {
    const meta = C.loadMeta(); const list = C.sortBooks(meta);
    const dragIdx = list.findIndex(b => b.id === dragId); if (dragIdx < 0) return;
    const [moved] = list.splice(dragIdx, 1);
    let targetIdx = list.findIndex(b => b.id === targetId);
    if (targetIdx < 0) list.splice(dragIdx, 0, moved);
    else { if (placeAfter) targetIdx += 1; list.splice(targetIdx, 0, moved); }
    list.forEach((b, i) => { b.order = i; });
    const map = new Map(list.map(b => [b.id, b]));
    const updated = meta.map(b => map.get(b.id) || b);
    C.saveMeta(updated);
    renderClassicLibrary();
  } 
function attachBookDragHandlers(el, bookId) {
  const grip = el.querySelector('.grip');
  if (!grip) return;

  let state = null;

  const onPointerDown = (e) => {
    if (e.button !== undefined && e.button !== 0 && e.pointerType === 'mouse') return;
    e.stopPropagation();
    // ВАЖНО: контейнер берём здесь — el уже в DOM
    const container = el.parentElement;
    if (!container) return;
    state = {
      id: bookId,
      el,
      container,
      startX: e.clientX,
      startY: e.clientY,
      pointerId: e.pointerId,
      active: false,
      pointerType: e.pointerType
    };
    window.addEventListener('pointermove', onPointerMove, { passive: false });
    window.addEventListener('pointerup', onPointerUp);
    window.addEventListener('pointercancel', onPointerUp);
  };

  const onPointerMove = (ev) => {
    if (!state || ev.pointerId !== state.pointerId) return;
    const dx = ev.clientX - state.startX;
    const dy = ev.clientY - state.startY;

    if (!state.active) {
      if (Math.abs(dx) < 6 && Math.abs(dy) < 6) return;
      state.active = true;
      state.el.classList.add('dragging');
      document.body.style.userSelect = 'none';
      document.body.style.webkitUserSelect = 'none';
      if (ev.cancelable) ev.preventDefault();
    } else {
      if (ev.cancelable) ev.preventDefault();
    }

    clearDragHighlights(state.container);
    const target = findDropTarget(state.container, ev.clientX, ev.clientY, state.el);
    if (target) {
      const midY = target.rect.top + target.rect.height / 2;
      target.el.classList.add(ev.clientY < midY ? 'drop-before' : 'drop-after');
    }
  };

  const onPointerUp = (ev) => {
    if (!state || ev.pointerId !== state.pointerId) return;
    const wasActive = state.active;
    const dragEl = state.el;
    const dragId = state.id;
    const containerEl = state.container;

    let targetId = null, placeAfter = false;
    if (wasActive) {
      const target = findDropTarget(containerEl, ev.clientX, ev.clientY, dragEl);
      if (target) {
        targetId = target.el.dataset.bookId;
        const midY = target.rect.top + target.rect.height / 2;
        placeAfter = ev.clientY >= midY;
      }
    }

    dragEl.classList.remove('dragging');
    clearDragHighlights(containerEl);
    document.body.style.userSelect = '';
    document.body.style.webkitUserSelect = '';

    window.removeEventListener('pointermove', onPointerMove);
    window.removeEventListener('pointerup', onPointerUp);
    window.removeEventListener('pointercancel', onPointerUp);

    state = null;

    if (wasActive && targetId && targetId !== dragId) {
      commitReorder(dragId, targetId, placeAfter);
    }
  };

  grip.addEventListener('pointerdown', onPointerDown);
  grip.addEventListener('contextmenu', (e) => e.preventDefault());
}

    go.addEventListener('click', apply);
    cancel.addEventListener('click', close);

        dragCounter++; $('drop-overlay').classList.add('show');

    window.addEventListener('dragover', (e) => {
      if (e.dataTransfer) e.dataTransfer.dropEffect = 'copy'; e.preventDefault();

      }
      const ctrl = e.ctrlKey || e.metaKey;
      if (ctrl && (e.key === 'f' || e.key === 'F')) { e.preventDefault(); openSearch(); }
      else if (ctrl && (e.key === 'b' || e.key === 'B')) { e.preventDefault(); addMark(); }
      else if (ctrl && (e.key === 'm' || e.key === 'M')) { e.preventDefault(); openMarks(); }
      else if (ctrl && (e.key === 't' || e.key === 'T')) { e.preventDefault(); openToc(); }
    });

    const rs = $('reader-screen');
    if (rs) rs.addEventListener('scroll', () => { updateAllProgress(); showScroller(); }, { passive: true });

    const sp = $('side-progress'); const sideThumb = $('side-thumb');
    if (sp && sideThumb) {
      let dragging = false;
      function scrollFromPointer(clientY) {
        const rect = sp.getBoundingClientRect(); const trackH = rect.height;
        const thumbH = sideThumb.offsetHeight || 40;
        const usable = Math.max(1, trackH - thumbH);
        let y = clientY - rect.top - thumbH / 2;
        y = Math.max(0, Math.min(usable, y));
        const pct = y / usable; const el = getActiveReaderEl(); if (!el) return;
        el.scrollTop = pct * (el.scrollHeight - el.clientHeight);
      }
      function startDrag(e) {
        if (window.getComputedStyle(sp).display === 'none') return;
        dragging = true; sp.classList.add('dragging', 'visible'); e.preventDefault();
        const y = e.touches ? e.touches[0].clientY : e.clientY; scrollFromPointer(y);
        document.addEventListener('mousemove', onDragMove, { passive: false });
        document.addEventListener('mouseup', endDrag);
        document.addEventListener('touchmove', onDragMove, { passive: false });
        document.addEventListener('touchend', endDrag);
        document.addEventListener('touchcancel', endDrag);
      }
      function onDragMove(e) {
        if (!dragging) return;
        const y = e.touches ? e.touches[0].clientY : e.clientY;
        scrollFromPointer(y); if (e.cancelable) e.preventDefault();
      }
      function endDrag() {
        if (!dragging) return; dragging = false;
        sp.classList.remove('dragging');
        document.removeEventListener('mousemove', onDragMove);
        document.removeEventListener('mouseup', endDrag);
        document.removeEventListener('touchmove', onDragMove);
        document.removeEventListener('touchend', endDrag);
        document.removeEventListener('touchcancel', endDrag);
        showScroller();
      }
      sp.addEventListener('mousedown', startDrag);
      sp.addEventListener('touchstart', startDrag, { passive: false });
      sp.addEventListener('mouseenter', () => { sp.classList.add('visible'); clearTimeout(sp._t); });
      sp.addEventListener('mouseleave', showScroller);
      sp.addEventListener('click', (e) => {
        if (window.getComputedStyle(sp).display === 'none') return;
        scrollFromPointer(e.clientY);
        updateAllProgress();
      });
    }

    window.addEventListener('orientationchange', () => {
      closeSheet(); closeSettingsModal(); closeAllPopups();
    });
    window.addEventListener('resize', () => {
      if (window.innerWidth > 768 && popOverlay) popOverlay.style.display = 'none';
      if (S.currentBookId) { measureChapterStarts(); if (tocPanel && tocPanel.classList.contains('open')) renderTocList(); }
    });
  }

  try { init(); } catch (err) {
    C.showError(err && err.message ? err.message : String(err));
    console.error(err);
  }
})();
</script>
